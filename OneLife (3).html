<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<title>OneLife</title>
<style>
:root{
  --bg:#0e1220; --bg2:#151a2c; --card:#1a2038; --card2:#212845;
  --gold:#e2b04a; --gold-soft:#f4d089; --text:#eef0f6; --sub:#98a1bf;
  --good:#5fd39a; --bad:#e0637a; --line:#2a3252; --barh:78px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background: radial-gradient(1100px 700px at 15% -10%, #212a52 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  min-height:100dvh;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
.wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column;}
header{
  padding:18px 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:linear-gradient(180deg, rgba(14,18,32,.97), rgba(14,18,32,.85));
  backdrop-filter:blur(6px);
}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:var(--gold-soft);}
.logo span{color:var(--text);}
.age-pill{background:var(--card2);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-size:12.5px;color:var(--sub);}
.age-pill b{color:var(--text);}
main{padding:6px 18px calc(92px + env(safe-area-inset-bottom,0px));flex:1 1 auto;}

.start{padding:36px 2px 20px;}
.start h1{font-size:34px;line-height:1.08;margin:0 0 10px;font-weight:700;}
.start p{color:var(--sub);font-size:14.5px;line-height:1.55;margin:0 0 26px;max-width:38ch;}
label.field{display:block;margin-bottom:15px;}
label.field span{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
input[type=text]{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;color:var(--text);font-size:16px;font-family:inherit;
}
.sexrow{display:flex;gap:10px;margin-bottom:12px;}
.sexbtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;cursor:pointer;}
.sexbtn.active{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:600;}
.diffrow{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.diffbtn{flex:1;min-width:90px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;cursor:pointer;text-align:center;}
.diffbtn.active{border-color:var(--gold);color:var(--gold-soft);}
.bigbtn{
  width:100%;padding:15px;border-radius:14px;border:none;background:var(--gold);color:#1a1406;
  font-weight:700;font-size:15.5px;cursor:pointer;font-family:'Fraunces',serif;
}
.bigbtn:active{transform:scale(.98);}
.bigbtn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line);}

.famcard{display:flex;gap:10px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;}
.fam-chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--sub);white-space:nowrap;}
.fam-chip b{color:var(--text);display:block;font-size:13px;margin-bottom:2px;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 14px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;}
.stat .lbl{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:7px;}
.bar{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:var(--gold);transition:width .4s;}
.stat.money{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;}
.stat.money .amt{font-family:'Fraunces',serif;font-size:20px;color:var(--gold-soft);font-weight:600;}

.tabs{display:flex;gap:6px;margin:14px 0 12px;overflow-x:auto;padding-bottom:2px;}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;cursor:pointer;font-weight:600;}
.tab.active{background:var(--gold);color:#1a1406;border-color:var(--gold);}

.feed{display:flex;flex-direction:column;gap:9px;margin-bottom:10px;}
.entry{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:14px;line-height:1.5;}
.entry .yr{color:var(--gold-soft);font-size:11.5px;font-weight:600;margin-bottom:4px;display:block;}
.entry.good{border-color:rgba(95,211,154,.35);}
.entry.bad{border-color:rgba(224,99,122,.35);}

.section-title{font-size:11.5px;color:var(--sub);margin:16px 2px 9px;font-weight:600;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.actbtn{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 13px;
  color:var(--text);font-size:13.5px;text-align:left;cursor:pointer;font-family:inherit;font-weight:500;
}
.actbtn small{display:block;color:var(--sub);font-size:11px;margin-top:3px;font-weight:400;}
.actbtn:active{background:var(--card2);}
.actbtn.wide{grid-column:1/-1;}
.actbtn.danger{border-color:rgba(224,99,122,.3);}
.empty{color:var(--sub);font-size:13.5px;padding:20px 4px;text-align:center;}

footer.bottombar{
  position:fixed;left:0;right:0;bottom:0;
  max-width:480px;margin:0 auto;
  padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg, rgba(14,18,32,1) 70%, rgba(14,18,32,.94));
  border-top:1px solid var(--line);
  display:flex;gap:10px;z-index:8;
  box-shadow:0 -6px 18px rgba(0,0,0,.35);
}
footer.bottombar .bigbtn{flex:1;min-height:52px;font-size:16px;}

.modal-bg{position:fixed;inset:0;background:rgba(8,10,18,.7);display:flex;align-items:flex-end;justify-content:center;z-index:30;}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;border:1px solid var(--line);border-bottom:none;max-height:82vh;overflow-y:auto;position:relative;}
.modal h3{font-size:19px;margin:0 0 4px;}
.modal p.sub{color:var(--sub);font-size:13px;margin:0 0 14px;}
.modal .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:10px;}
.modal .row:last-child{border-bottom:none;}
.close-x{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer;line-height:1;}
.deathscreen{text-align:center;padding:56px 8px 20px;}
.deathscreen h1{font-size:28px;margin-bottom:6px;}
.deathscreen p{color:var(--sub);line-height:1.6;margin-bottom:14px;}
.causepill{display:inline-flex;align-items:center;gap:8px;background:rgba(224,99,122,.1);border:1px solid rgba(224,99,122,.3);color:var(--bad);border-radius:999px;padding:8px 16px;font-size:12.5px;margin:0 auto 28px;}
.causepill b{color:#ffc3cd;font-weight:600;}

.sheet{max-height:92vh;padding-top:22px;}
.sheet h3{font-size:22px;margin:0 0 4px;padding-right:34px;}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 12px;padding:2px;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;}
.chip.on{background:var(--gold);color:#1a1406;border-color:var(--gold);}
.sec-t{font-size:11.5px;color:var(--sub);font-weight:600;margin:16px 2px 8px;letter-spacing:.02em;}
.finrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
.finrow:last-child{border-bottom:none;}
.finrow.tot{font-weight:700;font-size:14px;}
select.sel{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;margin-bottom:10px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;}

.close-x{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);top:14px !important;right:16px !important;}
.hic{display:inline-flex;vertical-align:-4px;margin-right:9px;color:var(--gold-soft);}
.hic.big{display:flex;justify-content:center;margin:0 0 10px;}
.section-title .ico{display:inline-block;vertical-align:-2px;}

.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.card2{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.card2 .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.card2 .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:hsl(var(--h) 75% 74%);background:hsl(var(--h) 38% 20%);}
.card2 .badge{font-size:10.5px;font-weight:600;color:var(--good);background:rgba(95,211,154,.12);padding:4px 9px;border-radius:999px;}
.card2 .cn{font-weight:600;font-size:14.5px;line-height:1.25;letter-spacing:-.005em;}
.card2 .cm{font-size:12px;color:var(--sub);line-height:1.5;flex:1;}
.card2 .cp{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;color:var(--gold-soft);margin-top:4px;}
.card2 .ca{display:flex;gap:8px;margin-top:8px;}
.cbtn{flex:1;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.cbtn.p{background:var(--gold);color:#1a1406;border-color:var(--gold);}
.cbtn.d{color:var(--bad);border-color:rgba(224,99,122,.4);}
.cbtn:disabled{opacity:.35;}
.cbtn:active{transform:scale(.97);}
.hic i,.section-title i{vertical-align:-1px;}
.tree{padding:6px 0 2px;}
.tgen{width:100%;}
.trow{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;}
.tline{width:2px;height:20px;background:linear-gradient(var(--line),var(--line));margin:2px auto;opacity:.7;}
.tnode{display:flex;flex-direction:column;align-items:center;width:68px;text-align:center;cursor:default;}
.tnode[data-pid]{cursor:pointer;}
.tnode[data-pid]:active{transform:scale(.95);}
.tavatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:hsl(var(--h) 80% 80%);background:linear-gradient(160deg,hsl(var(--h) 45% 30%),hsl(var(--h) 45% 16%));border:1.5px solid hsl(var(--h) 45% 42%);box-shadow:0 4px 10px rgba(0,0,0,.3);}
.tavatar.dead{color:var(--sub);background:linear-gradient(160deg,#2a3049,#1a1e30);border-color:var(--line);}
.tnode.me .tavatar{color:#1a1406;background:linear-gradient(160deg,var(--gold-soft),var(--gold));border-color:var(--gold);box-shadow:0 4px 14px rgba(226,176,74,.45);}
.tname{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.2;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trole{font-size:10px;color:var(--sub);margin-top:1px;}
.tnode.me .trole{color:var(--gold-soft);}

/* ===== Téléphone ===== */
.phone-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(5,6,12,.88);padding:16px;}
.phone-frame{width:min(300px,82vw);height:min(620px,80vh);background:#0a0c16;border-radius:44px;padding:9px;box-shadow:0 25px 70px rgba(0,0,0,.6), 0 0 0 2px #1c2133;flex:none;}
.phone-screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%, #222b52 0%, #0d1020 65%);}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:42%;height:20px;background:#0a0c16;border-bottom-left-radius:14px;border-bottom-right-radius:14px;z-index:6;}
.pscreen{position:absolute;inset:0;display:flex;flex-direction:column;}
.pscreen.lock{z-index:3;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .4s;padding:0 20px;}
.pscreen.lock.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none;}
.lock-time{font-family:'Fraunces',serif;font-size:52px;font-weight:600;color:#fff;letter-spacing:-1px;}
.lock-date{font-size:12.5px;color:var(--sub);margin-bottom:10px;}
.lock-notif{font-size:11.5px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;padding:6px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;margin-bottom:26px;}
.lock-hint{position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:11px;animation:pulseup 1.8s ease-in-out infinite;}
@keyframes pulseup{0%,100%{opacity:.5;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}
.pscreen.home{z-index:2;opacity:0;transform:scale(.96);transition:opacity .4s, transform .4s;pointer-events:none;}
.pscreen.home.active{opacity:1;transform:scale(1);pointer-events:auto;}
.pstatus{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:12px;color:#fff;font-weight:600;}
.pstatus-icons{display:flex;gap:6px;opacity:.85;}
.papps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 10px;padding:26px 18px;}
.papp-ic.hue5{background:linear-gradient(145deg,#93c5fd,#2563eb);}
.papp-ic.hue6{background:linear-gradient(145deg,#fde68a,#b45309);}
.papp{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.papp:active{transform:scale(.93);}
.papp span{font-size:9.5px;color:#dfe3f2;text-align:center;}
.papp-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.35);}
.papp-ic.hue1{background:linear-gradient(145deg,#4ade80,#16a34a);}
.papp-ic.hue2{background:linear-gradient(145deg,#60a5fa,#2563eb);}
.papp-ic.hue3{background:linear-gradient(145deg,#fbbf24,#d97706);}
.papp-ic.hue4{background:linear-gradient(145deg,#f472b6,#db2777);}
.pbadge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.pscreen.app{z-index:4;transform:translateY(100%);transition:transform .38s cubic-bezier(.4,0,.2,1);background:var(--bg2);}
.pscreen.app.active{transform:translateY(0);}
.papp-header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line);}
.papp-back{background:rgba(255,255,255,.06);border:none;width:30px;height:30px;border-radius:50%;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.papp-title{font-weight:700;font-size:14.5px;}
.papp-body{flex:1;overflow-y:auto;padding:12px 14px;}
.pmsg{display:flex;gap:10px;margin-bottom:16px;}
.pmsg-av,.pcontact .pmsg-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#3a4270,#20264a);color:#dfe3f2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.pmsg-from{font-size:12px;font-weight:600;margin-bottom:4px;}
.pmsg-bubble{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;line-height:1.4;}
.pmsg-actions{display:flex;gap:8px;margin-top:7px;}
.pcontact{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.pcontact:active{background:var(--card2);}
.pcontact-role{font-size:11px;color:var(--sub);}
.pmail{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
.pmail-ic{width:30px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex:none;}
.pmail-from{font-size:11px;color:var(--sub);}
.pmail-subj{font-size:13px;font-weight:600;margin:2px 0 3px;}
.pmail-txt{font-size:12px;color:var(--sub);line-height:1.4;}
.pcard{background:linear-gradient(145deg,#2a3360,#161a30);border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid var(--line);}
.pcard-label{font-size:11px;color:var(--sub);margin-bottom:4px;}
.pcard-amt{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--gold-soft);}
.phone-exit{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:9px 18px;border-radius:999px;font-size:12.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;}
.cchart{width:100%;height:100px;display:block;margin-top:6px;}
.pstore-search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-size:13.5px;font-family:inherit;margin-bottom:12px;}
.pstore-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);}
.pstore-info{flex:1;min-width:0;}
.pstore-name{font-size:13px;font-weight:600;}
.pstore-desc{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pinstallbar{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;}
.pinstallfill{height:100%;width:0%;background:var(--gold);border-radius:4px;transition:width .15s;}
.pnotes{width:100%;height:100%;min-height:380px;background:transparent;border:none;color:var(--text);font-size:14px;line-height:1.6;font-family:inherit;resize:none;outline:none;}
.pcalc-disp{background:#000;border-radius:12px;padding:20px 14px;text-align:right;font-size:30px;font-family:'Fraunces',serif;color:#fff;margin-bottom:12px;min-height:60px;word-break:break-all;}
.pcalc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.pcalc-key{padding:14px 0;border-radius:12px;border:none;background:var(--card2);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;}
.pcalc-key.op{background:var(--gold);color:#1a1406;}
.pdpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px;justify-content:center;margin-top:6px;}
.pdbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pmemory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.pmemory-card{aspect-ratio:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
.pmemory-card.open{background:var(--card);border-color:var(--gold);}
.pmemory-card.matched{opacity:.45;border-color:var(--good);}
.cx-portfolio{font-size:11.5px;color:var(--sub);padding:4px 2px 2px;border-bottom:1px solid var(--line);margin-bottom:4px;}
.cx-portfolio b{color:var(--gold-soft);}
.cx-card{background:#0a0d1a;border:1px solid #1e2640;border-radius:14px;padding:14px;margin-bottom:12px;}
.cx-pair{font-size:11px;color:#6b7a9a;margin-bottom:4px;}.cx-pair span{color:#3a4a70;}
.cx-price{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#e8ecf4;letter-spacing:-0.5px;}
.cx-chg{font-size:11.5px;font-weight:700;margin-bottom:8px;}
.cx-buyrow{display:flex;align-items:center;background:#0a0d1a;border:1px solid #1e2640;border-radius:12px;padding:8px 12px;gap:8px;margin-top:12px;}
.cx-buyrow span{color:#6b7a9a;font-size:14px;}
.cx-buyrow input{background:none;border:none;color:#e8ecf4;font-size:16px;font-weight:600;font-family:inherit;flex:1;outline:none;}

<body>
<div class="wrap">
  <header>
    <div class="logo">One<span>Life</span></div>
    <div class="age-pill" id="ageP">—</div>
  </header>
  <main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s);
let S=null;
let TAB="vie";
const NAMES_M=["Léo","Noah","Hugo","Gabriel","Raphaël","Adam","Arthur","Louis","Jules","Sacha","Nathan","Ethan"];
const NAMES_F=["Emma","Louise","Jade","Alice","Chloé","Lina","Rose","Anna","Léa","Mia","Camille","Inès"];
const SURN=["Martin","Bernard","Dubois","Petit","Robert","Moreau","Girard","Roux","Fontaine","Laurent","Simon","Michel"];
const CITIES=["Lyon","Marseille","Nantes","Lille","Bordeaux","Toulouse","Rennes","Strasbourg"];

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[rnd(0,arr.length-1)];}
function clamp(v){return Math.max(0,Math.min(100,v));}
function money(n){return (n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString('fr-FR')+" €";}
function randomPerson(sex){ return pick(sex==="F"?NAMES_F:NAMES_M)+" "+pick(SURN); }
function cuid(){ return Math.random().toString(36).slice(2,9); }
const CRYPTOS=[{k:"BTC",name:"BitCoin",base:45000,vol:0.028},{k:"ETH",name:"EtherCoin",base:2500,vol:0.034},{k:"DOGX",name:"DogeX",base:0.09,vol:0.06}];
function initCrypto(){
  const prices={}, history={}, holdings={};
  CRYPTOS.forEach(c=>{
    prices[c.k]=c.base;
    const h=[]; let v=c.base;
    for(let i=0;i<24;i++){ v=Math.max(c.base*0.2, v*(1+(Math.random()-0.5)*c.vol)); h.push(v); }
    h[h.length-1]=c.base;
    history[c.k]=h;
    holdings[c.k]={amt:0,cost:0};
  });
  return {prices,history,holdings};
}

const VEHICLE_CATALOG = [
  {type:"velo", name:"Vélo", value:300},
  {type:"scooter", name:"Scooter", value:2500},
  {type:"citadine", name:"Citadine", value:8000},
  {type:"berline", name:"Berline", value:22000},
  {type:"suv", name:"SUV", value:38000},
  {type:"sportive", name:"Voiture sportive", value:75000},
  {type:"luxe", name:"Voiture de luxe", value:150000},
];
const HOUSING_CATALOG = [
  {type:"studio", name:"Studio", value:60000, rentYear:6000},
  {type:"appartement", name:"Appartement", value:150000, rentYear:12000},
  {type:"maison", name:"Maison", value:280000, rentYear:18000},
  {type:"villa", name:"Villa", value:600000, rentYear:36000},
  {type:"manoir", name:"Manoir", value:1500000, rentYear:80000},
];
const PET_CATALOG = [
  {type:"chien", name:"Chien", cost:400, vet:250, life:13, upkeep:650},
  {type:"chat", name:"Chat", cost:250, vet:180, life:15, upkeep:450},
  {type:"lapin", name:"Lapin", cost:80, vet:80, life:9, upkeep:180},
  {type:"poisson", name:"Poisson", cost:30, vet:20, life:5, upkeep:60},
  {type:"oiseau", name:"Oiseau", cost:60, vet:60, life:10, upkeep:150},
];
const LUXURY_CATALOG = [
  {name:"Montre de luxe", value:5000},
  {name:"Bijoux", value:8000},
  {name:"Œuvre d'art", value:15000},
  {name:"Yacht", value:400000},
  {name:"Collier de diamants", value:25000},
  {name:"Cave à vins", value:12000},
  {name:"Avion privé", value:5000000},
];

const OBJECTIVES = {
  millionaire:{label:"Devenir millionnaire (1 M€ de patrimoine)", icon:"coins", progress:s=>Math.min(1,(s.money+s.savings+(s.housing&&!s.housing.rented?s.housing.value:0))/1000000)},
  family:{label:"Fonder une famille de 3 enfants ou plus", icon:"users", progress:s=>Math.min(1,s.kids.length/3)},
  homeowner:{label:"Devenir propriétaire de ton logement", icon:"home", progress:s=>(s.housing&&!s.housing.rented)?1:0},
  graduate:{label:"Décrocher un doctorat", icon:"cap", progress:s=>s.degrees.some(d=>d.level==="Doctorat")?1:0},
  entrepreneur:{label:"Diriger une entreprise valant 100 000 €", icon:"briefcase", progress:s=>s.company?Math.min(1,s.company.value/100000):0},
  centenaire:{label:"Atteindre 100 ans", icon:"star", progress:s=>Math.min(1,s.age/100)},
  luxelife:{label:"Posséder 3 objets de luxe", icon:"gem", progress:s=>Math.min(1,s.luxury.length/3)},
  social:{label:"Te faire 5 amis", icon:"users", progress:s=>Math.min(1,(s.friends?s.friends.length:0)/5)},
};
function pickObjectives(traits){
  const pool=[];
  if(traits.ambition>=55) pool.push("millionaire","entrepreneur");
  if(traits.sociability>=55) pool.push("family","social");
  if(traits.discipline>=55) pool.push("graduate");
  if(traits.courage>=55) pool.push("centenaire");
  pool.push("homeowner","luxelife","millionaire","family","graduate","centenaire","social");
  const chosen=[]; const src=[...new Set(pool)];
  while(chosen.length<2 && src.length){ const i=rnd(0,src.length-1); chosen.push(src.splice(i,1)[0]); }
  return chosen.map(key=>({key, done:false}));
}
function checkObjectives(pushY){
  (S.objectives||[]).forEach(o=>{
    if(o.done) return;
    const def=OBJECTIVES[o.key]; if(!def) return;
    if(def.progress(S)>=1){ o.done=true; S.happiness=clamp(S.happiness+15); S.reputation=clamp(S.reputation+5);
      pushY(`Objectif accompli : ${def.label} !`,"good"); mark(`Objectif accompli : ${def.label}.`); }
  });
}
function mark(text){ (S.timeline=S.timeline||[]).push({age:S.age,text}); if(S.timeline.length>250) S.timeline.shift(); }

function newLife(name,sex,diff,gen,lineage){
  const surname=lineage?lineage.surname:pick(SURN);
  const first = name || pick(sex==="F"?NAMES_F:NAMES_M);
  const middle = pick(sex==="F"?NAMES_F:NAMES_M);
  const o = {
    firstName:first, middleName:middle, lastName:surname,
    name: first+" "+surname,
    surname, sex, age:0, alive:true, diff, generation: gen||1,
    health:rnd(80,100), happiness:rnd(70,100), smarts:rnd(25,60), looks:rnd(25,70), karma:50,
    stress:rnd(10,30), energy:100, reputation:50, luck:rnd(20,80),
    ambition:rnd(20,80), courage:rnd(20,80), empathy:rnd(20,80), discipline:rnd(20,80), sociability:rnd(20,80), creativity:rnd(20,80),
    money: lineage? lineage.inheritance||0 : (diff==="facile"?2000:diff==="difficile"?0:500),
    job:null, salary:0, jobTitle:null, company:null, degrees:[], studyYears:0, studyLevel:null, studyFails:0, scholarship:false, parentsFunding:false, expYears:0, jobHistory:[], telework:false, pension:0,
    school:"Bébé", eduStage:0, major:null,
    phoneAge:rnd(10,20), relationship:null, partner:null, married:false, affair:false, pregnant:false, kids:[],
    father: lineage? lineage.father : {name:pick(NAMES_M)+" "+surname, alive:true, closeness:rnd(50,80), memory:[]},
    mother: lineage? lineage.mother : {name:pick(NAMES_F)+" "+surname, alive:true, closeness:rnd(50,80), memory:[]},
    siblings: lineage? lineage.siblings : Array.from({length: rnd(0,2)}, ()=>({name: pick(Math.random()<0.5?NAMES_M:NAMES_F)+" "+surname, closeness:rnd(40,80), memory:[], job:pick(NPC_JOBS), wealth:"stable", mood:rnd(55,80), life:[], lastSeen:0})),
    grandparents: lineage? lineage.grandparents : Array.from({length:rnd(1,4)}, ()=>({name:pick(Math.random()<0.5?NAMES_M:NAMES_F)+" "+pick(SURN), alive:true, closeness:rnd(30,70)})),
    auntsUncles: lineage? lineage.auntsUncles : Array.from({length:rnd(0,3)}, ()=>({name:pick(Math.random()<0.5?NAMES_M:NAMES_F)+" "+pick(SURN), closeness:rnd(20,60)})),
    assets:[], savings:0, loans:[], vehicles:[], housing:null, pets:[], luxury:[], criminalRecord:false, jailYears:0, crimeRep:0, gang:null, record:[], cleanYears:0, fugitive:false, escapedRemaining:0, behavior:0, reinsert:0, prisonGang:false, coldCase:false,
    friends:[], network:[], spouse:null, objectives:[],
    maxMoney:0, timeline:[],
    repPro:50, repSocial:50, repFinance:50, repMedia:50,
    social:{handle:null, followers:0, posts:0, active:false},
    conditions:[], healthInsurance:false,
    travel:{visited:[], trips:0},
    fitnessStreak:0, diet:"normal",
    deathCause:null, achievements:[], crypto:initCrypto(), phoneNotes:"", phoneModel:null, installedApps:[], miniGameScores:{snake:0,flappy:0,memoryBest:null,coinBest:0},
    fuelPrice: +(rnd(140,220)/100).toFixed(2),
    relNeglect:0,
    city: pick(CITIES),
    feed:[], recentEvents:[], milestones:[]
  };
  o.objectives = pickObjectives(o);
  return o;
}

function save(){
  if(!S) return;
  try{ localStorage.setItem('onelife_save', JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    let r=localStorage.getItem('onelife_save');
    if(!r) r=localStorage.getItem('lifesim_save');
    if(!r) return null;
    const d=JSON.parse(r);
    return migrate(d);
  }catch(e){ return null; }
}
function remember(person, text, impact){
  if(!person) return;
  if(!Array.isArray(person.memory)) person.memory=[];
  person.memory.unshift({age:S.age, text});
  if(person.memory.length>12) person.memory.pop();
  if(typeof impact==="number") person.closeness=clamp(person.closeness+impact);
}
function migrate(d){
  const surname = d.surname || pick(SURN);
  if(!d.father) d.father={name:pick(NAMES_M)+" "+surname, alive:true, closeness:rnd(50,80), memory:[]};
  if(!d.mother) d.mother={name:pick(NAMES_F)+" "+surname, alive:true, closeness:rnd(50,80), memory:[]};
  if(!d.father.memory) d.father.memory=[];
  if(!d.mother.memory) d.mother.memory=[];
  if(!Array.isArray(d.siblings)) d.siblings=[];
  d.siblings.forEach(s=>{ if(!s.memory) s.memory=[]; });
  if(!Array.isArray(d.grandparents)) d.grandparents=Array.from({length:rnd(1,4)}, ()=>({name:pick(Math.random()<0.5?NAMES_M:NAMES_F)+" "+pick(SURN), alive:true, closeness:rnd(30,70)}));
  if(!Array.isArray(d.auntsUncles)) d.auntsUncles=Array.from({length:rnd(0,3)}, ()=>({name:pick(Math.random()<0.5?NAMES_M:NAMES_F)+" "+pick(SURN), closeness:rnd(20,60)}));
  if(!d.firstName){ const parts=(d.name||"Inconnu Inconnu").split(" "); d.firstName=parts[0]; d.lastName=d.surname||parts[parts.length-1]; d.middleName=pick(d.sex==="F"?NAMES_F:NAMES_M); }
  if(typeof d.stress!=="number") d.stress=rnd(10,30);
  if(typeof d.energy!=="number") d.energy=100;
  if(typeof d.reputation!=="number") d.reputation=50;
  if(typeof d.luck!=="number") d.luck=rnd(20,80);
  ["ambition","courage","empathy","discipline","sociability","creativity"].forEach(t=>{ if(typeof d[t]!=="number") d[t]=rnd(20,80); });
  if(typeof d.affair!=="boolean") d.affair=false;
  if(typeof d.pregnant!=="boolean") d.pregnant=false;
  if(!Array.isArray(d.friends)) d.friends=[];
  if(!Array.isArray(d.network)) d.network=[];
  if(!("spouse" in d)) d.spouse=null;
  if(!Array.isArray(d.objectives) || !d.objectives.length) d.objectives=pickObjectives(d);
  if(typeof d.maxMoney!=="number") d.maxMoney=d.money||0;
  ["repPro","repSocial","repFinance","repMedia"].forEach(k=>{ if(typeof d[k]!=="number") d[k]=d.reputation||50; });
  if(!d.social) d.social={handle:null,followers:0,posts:0,active:false};
  if(!Array.isArray(d.conditions)) d.conditions=[];
  if(typeof d.healthInsurance!=="boolean") d.healthInsurance=false;
  if(!d.travel) d.travel={visited:[],trips:0};
  if(typeof d.fitnessStreak!=="number") d.fitnessStreak=0;
  if(!d.diet) d.diet="normal";
  if(!Array.isArray(d.achievements)) d.achievements=[];
  if(!("deathCause" in d)) d.deathCause=null;
  if(!d.crypto || !d.crypto.prices) d.crypto=initCrypto();
  if(typeof d.phoneNotes!=="string") d.phoneNotes="";
  if(!("phoneModel" in d)) d.phoneModel=null;
  if(!Array.isArray(d.installedApps)) d.installedApps=[];
  if(!d.miniGameScores) d.miniGameScores={snake:0,flappy:0,memoryBest:null,coinBest:0};
  if(typeof d.phoneAge!=="number") d.phoneAge=rnd(10,20);
  [d.father,d.mother,...(d.siblings||[])].forEach(npc=>{
    if(!npc) return;
    if(npc.job===undefined) npc.job=pick(NPC_JOBS);
    if(!npc.wealth) npc.wealth="stable";
    if(npc.mood==null) npc.mood=65;
    if(!Array.isArray(npc.life)) npc.life=[];
    if(npc.lastSeen==null) npc.lastSeen=0;
  });
  if(!("partner" in d)) d.partner = d.relationship ? {name:d.relationship, closeness:rnd(55,75), memory:[], job:pick(NPC_JOBS.filter(j=>j!=="sans emploi")), wealth:"stable", mood:rnd(55,80), life:[], lastSeen:d.age} : null;
  else if(d.partner && !Array.isArray(d.partner.life)) d.partner.life=[];
  if(typeof d.fuelPrice!=="number") d.fuelPrice=1.8;
  if(typeof d.relNeglect!=="number") d.relNeglect=0;
  (d.friends||[]).forEach(f=>{ if(typeof f.lastSeen!=="number") f.lastSeen=d.age; });
  (d.vehicles||[]).forEach(v=>{ if(typeof v.km!=="number") v.km=rnd(5000,40000); if(typeof v.lastControl!=="number") v.lastControl=d.age; });
  if(!Array.isArray(d.timeline)) d.timeline=[];
  if(typeof d.generation!=="number") d.generation=1;
  if(!Array.isArray(d.kids)) d.kids=[];
  d.kids.forEach(k=>{ if(!k.sex) k.sex = Math.random()<0.5?"M":"F"; });
  if(!Array.isArray(d.assets)) d.assets=[];
  if(typeof d.savings!=="number") d.savings=0;
  if(!Array.isArray(d.loans)) d.loans=[];
  if(!Array.isArray(d.vehicles)) d.vehicles=[];
  if(!Array.isArray(d.pets)) d.pets=[];
  if(!Array.isArray(d.luxury)) d.luxury=[];
  if(!("company" in d)) d.company=null;
  if(!Array.isArray(d.degrees)) d.degrees=[];
  if(typeof d.studyYears!=="number") d.studyYears=0;
  if(!("studyLevel" in d)) d.studyLevel=null;
  if(typeof d.studyFails!=="number") d.studyFails=0;
  if(typeof d.scholarship!=="boolean") d.scholarship=false;
  if(typeof d.parentsFunding!=="boolean") d.parentsFunding=false;
  if(typeof d.expYears!=="number") d.expYears=0;
  if(!Array.isArray(d.jobHistory)) d.jobHistory=[];
  if(typeof d.telework!=="boolean") d.telework=false;
  if(typeof d.pension!=="number") d.pension=0;
  if(d.company && typeof d.company.debt!=="number") d.company.debt=0;
  if(d.assets.includes("Voiture") && d.vehicles.length===0){ d.vehicles.push({id:cuid(),name:"Citadine",type:"citadine",value:8000}); }
  if(d.assets.includes("Maison") && !d.housing){ d.housing={name:"Maison",type:"maison",value:150000,rented:false}; }
  if(!Array.isArray(d.feed)) d.feed=[];
  if(!Array.isArray(d.recentEvents)) d.recentEvents=[];
  if(!Array.isArray(d.milestones)) d.milestones=[];
  if(typeof d.karma!=="number") d.karma=50;
  if(typeof d.jailYears!=="number") d.jailYears=0;
  if(typeof d.crimeRep!=="number") d.crimeRep=0;
  if(!("gang" in d)) d.gang=null;
  if(!Array.isArray(d.record)) d.record=[];
  ["cleanYears","escapedRemaining","behavior","reinsert"].forEach(k=>{ if(typeof d[k]!=="number") d[k]=0; });
  ["fugitive","prisonGang","coldCase"].forEach(k=>{ if(typeof d[k]!=="boolean") d[k]=false; });
  if(typeof d.criminalRecord!=="boolean") d.criminalRecord=false;
  if(typeof d.eduStage!=="number") d.eduStage=0;
  if(!d.major) d.major=null;
  if(!d.city) d.city=pick(CITIES);
  if(!d.diff) d.diff="normal";
  if(typeof d.married!=="boolean") d.married=false;
  if(!("relationship" in d)) d.relationship=null;
  if(!("jobTitle" in d)) d.jobTitle=d.job&&typeof d.job==="string"?d.job:null;
  if(typeof d.job==="string") d.job=true;
  if(typeof d.salary!=="number") d.salary=0;
  return d;
}
function log(text, cls){ S.feed.unshift({age:S.age, text, cls: cls||""}); if(S.feed.length>80) S.feed.pop(); }

function render(){
  try{
    $('#ageP').textContent = S ? (S.alive ? `${S.name.split(' ')[0]} · ${S.age} ans` : `${S.name.split(' ')[0]} · décédé(e)`) : "—";
    document.querySelector('footer.bottombar')?.remove();
    if(!S){ renderStart(); return; }
    if(!S.alive){ renderDeath(); return; }
    renderGame();
  }catch(err){
    document.querySelector('footer.bottombar')?.remove();
    $('#main').innerHTML = `<div class="start"><h1>Oups.</h1><p>Une erreur est survenue en chargeant ta partie. Tu peux recommencer une nouvelle vie.</p><button class="bigbtn" id="hardReset" type="button">Recommencer une nouvelle vie</button></div>`;
    $('#hardReset').addEventListener('click',()=>{ S=null; clearSave(); render(); });
  }
}

function renderStart(){
  $('#main').innerHTML = `
  <div class="start">
    <h1>Une vie entière,<br>une décision à la fois.</h1>
    <p>Crée ton personnage : famille, études, carrière, amour, argent, santé — et vis son histoire jusqu'au bout.</p>
    <label class="field"><span>Prénom (optionnel)</span><input type="text" id="nameIn" placeholder="Laisser vide pour un tirage aléatoire"></label>
    <div class="sexrow">
      <button class="sexbtn active" data-sex="F" id="sexF">Fille</button>
      <button class="sexbtn" data-sex="M" id="sexM">Garçon</button>
    </div>
    <div class="diffrow" id="diffRow">
      <button class="diffbtn" data-d="facile">Facile</button>
      <button class="diffbtn active" data-d="normal">Normal</button>
      <button class="diffbtn" data-d="difficile">Difficile</button>
    </div>
    <button class="bigbtn" id="startBtn" type="button">Commencer une nouvelle vie</button>
  </div>`;
  let sex="F", diff="normal";
  $('#sexF').onclick=()=>{sex="F";$('#sexF').classList.add('active');$('#sexM').classList.remove('active');};
  $('#sexM').onclick=()=>{sex="M";$('#sexM').classList.add('active');$('#sexF').classList.remove('active');};
  document.querySelectorAll('.diffbtn').forEach(b=>b.onclick=()=>{diff=b.dataset.d;document.querySelectorAll('.diffbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
  $('#startBtn').addEventListener('click',()=>{
    S = newLife($('#nameIn').value.trim(), sex, diff);
    log(`${S.name} est né(e) à ${S.city}, fils/fille de ${S.mother.name} et ${S.father.name}.`, "good");
    TAB="vie"; save(); render();
  });
}

function statBar(label,val){
  return `<div class="stat"><div class="lbl"><span>${label}</span><span>${val}</span></div><div class="bar"><i style="width:${val}%"></i></div></div>`;
}

function schoolLabel(){
  if(S.age<3) return "Bébé";
  if(S.age<6) return "Maternelle";
  if(S.age<11) return "École primaire";
  if(S.age<15) return "Collège";
  if(S.age<18) return "Lycée";
  if(S.studyLevel) return "Université — "+S.major+" ("+S.studyLevel+", année "+(S.studyYears+1)+")";
  if(S.degrees.length){ const d=S.degrees[S.degrees.length-1]; return d.level+" en "+d.field; }
  return "Sans études supérieures";
}

function renderGame(){
  document.querySelector('footer.bottombar')?.remove();
  if(TAB==='ombre' && S.age<14) TAB='vie';

  document.querySelectorAll('.fam-chip[data-p]').forEach(c=>{
    c.addEventListener('click',()=>{
      const p=c.dataset.p;
      if(p==="father") showPersonModal(S.father,"Père");
      else if(p==="mother") showPersonModal(S.mother,"Mère");
      else if(p==="sib") showPersonModal(S.siblings[c.dataset.i],"Frère/sœur");

    const b=document.createElement('button');
    b.type='button';

    d.className='entry'+(e.cls?' '+e.cls:'');
    d.innerHTML=`<span class="yr">${e.age===0?"Naissance":e.age+" ans"}</span>${e.text}`;

function hasDegree(field, minLevel){
  const order={Licence:1,Master:2,Doctorat:3};
  return (S.degrees||[]).some(d=>d.field===field && order[d.level]>=(order[minLevel]||1));
}
function availableJobs(){
  const degreeFields = new Set((S.degrees||[]).map(d=>d.field));
  let pool = JOBS_BASE.filter(j=> !j.minAge || S.age>=j.minAge).filter(j=> !REGULATED.test(j.title));
  (S.degrees||[]).forEach(d=>{
    const tiers=JOBS_UNI[d.field]||[];
    tiers.forEach((t,i)=>{
      const minExp=i*3;
      if(i===0 || (S.expYears||0)>=minExp || hasDegree(d.field,"Master")){
        if(!pool.find(x=>x.title===t.title)) pool.push(t);
      }
    });
  });
  if(S.age<16) pool=pool.filter(j=>["Employé de magasin","Serveur/se","Livreur"].includes(j.title));
  if(S.fugitive) return [];
  if(S.criminalRecord) pool=pool.filter(j=>!RESTRICTED_JOBS.test(j.title));
  return pool.filter(j=> Object.keys(j.req).every(k=> S[k]>=j.req[k]));
}

function depositSavings(){
  const amt = Math.min(S.money, rnd(200,2000));
  if(amt<50){ log("Pas assez d'argent à épargner.","bad"); return; }
  S.money-=amt; S.savings+=amt;
  log(`Tu as placé ${money(amt)} sur ton épargne.`,"good");
}
function withdrawSavings(){
  const amt = Math.min(S.savings, rnd(200,2000));
  S.savings-=amt; S.money+=amt;
  log(`Tu as retiré ${money(amt)} de ton épargne.`,"good");
}

function showCatalog(o){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const sheet=document.createElement('div'); sheet.className='modal sheet'; bg.appendChild(sheet);
  let cur="Tous"; const close=()=>bg.remove();
  const draw=()=>{
    const iv=sheet.querySelector('#ctInput'); const keep=iv?iv.value:"";
    const fh=o.filters?`<div class="chips">${["Tous",...o.filters].map(f=>`<button type="button" class="chip${f===cur?' on':''}" data-c="${f}">${f}</button>`).join("")}</div>`:"";
    const secs=o.sections.map((s,si)=>{
      const its=s.items.map((it,k)=>({it,k})).filter(x=>cur==="Tous"||!x.it.cat||x.it.cat===cur);
      if(!its.length) return "";
      return (s.title?`<div class="sec-t">${s.title}</div>`:"")+`<div class="cgrid">`+its.map(({it,k})=>`<div class="card2" style="--h:${it.hue||40}"><div class="ct"><span class="ic">${icon(it.icon,20)}</span>${it.badge?`<span class="badge">${it.badge}</span>`:""}</div><div class="cn">${it.name}</div><div class="cm">${it.meta||""}</div>${(!it.badge&&(it.priceText||it.price!=null))?`<div class="cp">${it.priceText||money(it.price)}</div>`:""}<div class="ca">${(it.actions||[]).map((a,ai)=>`<button type="button" class="cbtn${a.primary?' p':''}${a.danger?' d':''}" ${a.disabled?'disabled':''} data-k="${si}:${k}:${ai}">${a.label}</button>`).join("")}</div></div>`).join("")+`</div>`;
    }).join("")||`<div class="entry">Rien à afficher pour le moment.</div>`;
    sheet.innerHTML=`${o.locked?"":'<button class="close-x" type="button" id="ctClose">'+icon('x',22)+'</button>'}<h3>${o.icon?`<span class="hic">${icon(o.icon,22)}</span>`:""}${o.title}</h3>${o.sub?`<p class="sub">${o.sub}</p>`:""}${o.input?`<label class="field"><span>${o.input.label}</span><input type="text" id="ctInput" placeholder="${o.input.placeholder||""}"></label>`:""}${fh}${secs}`;
    const ni=sheet.querySelector('#ctInput'); if(ni) ni.value=keep;
    const cx=sheet.querySelector('#ctClose'); if(cx) cx.addEventListener('click',close);
    sheet.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.c;draw();}));
    sheet.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{
      const [si,k,ai]=b.dataset.k.split(":").map(Number);
      const val=(sheet.querySelector('#ctInput')||{}).value||"";
      o.sections[si].items[k].actions[ai].fn(close,val);
    }));
  };
  draw();
  document.body.appendChild(bg);
  bg.addEventListener('click',(e)=>{ if(e.target===bg) close(); });
}

const VEH_SPEC={velo:{conso:0,km:2000,ctrl:0},scooter:{conso:3,km:6000,ctrl:0},citadine:{conso:6,km:12000,ctrl:80},berline:{conso:7.5,km:15000,ctrl:90},suv:{conso:9.5,km:14000,ctrl:100},sportive:{conso:12,km:8000,ctrl:130},luxe:{conso:11,km:10000,ctrl:150}};
const VEH_META={velo:["bike",150,"Écolo, gratuit à entretenir."],scooter:["scooter",30,"Parfait pour la ville."],citadine:["car",210,"Fiable et économique."],berline:["car",210,"Confort et route."],suv:["suv",200,"Espace pour toute la famille."],sportive:["sportcar",280,"Sensations et statut."],luxe:["gem",320,"Le summum du prestige."]};
function vehCost(v){ const cat=VEHICLE_CATALOG.find(x=>x.type===v.type); return Math.max(150,Math.floor((cat?cat.value:v.value)*0.04)); }
function fuelCostOf(v){ const spec=VEH_SPEC[v.type]||{conso:0,km:10000}; return Math.round(spec.conso/100*spec.km*S.fuelPrice); }
function fuelPriceLabel(){ return S.fuelPrice.toFixed(2).replace(".",",")+" €/L"; }
function updateFuelPrice(){
  let p=S.fuelPrice + (Math.random()-0.5)*0.9;
  if(rnd(1,100)<=6) p += rnd(1,100)<=50 ? rnd(2,5) : -rnd(1,2);
  S.fuelPrice = Math.max(1.1, Math.min(8, +p.toFixed(2)));
}
function vehicleLoanTerms(v){ return v<15000?{y:4,r:0.07}:v<50000?{y:5,r:0.065}:{y:6,r:0.06}; }
function startLoan(kind,principal,years,rate){
  S.loans.push({id:cuid(), kind, balance:principal, rate, yearlyPayment:Math.floor(principal/years*(1+rate*years*0.55))});
}
function showVehiclesModal(){
  const owned=S.vehicles.map(v=>({icon:(VEH_META[v.type]||["car"])[0],hue:210,name:v.name,badge:"Possédé",meta:`Valeur actuelle ${money(v.value)}<br>${(VEH_SPEC[v.type]||{}).conso?`Carburant ~${money(fuelCostOf(v))}/an (${fuelPriceLabel()})<br>`:""}${v.km||0} km · contrôle technique dû dans ${Math.max(0,2-((S.age-(v.lastControl||S.age))%2))} an(s)`,actions:[{label:"Vendre "+money(Math.floor(v.value*0.9)),danger:true,fn:(close)=>{
    const r=Math.floor(v.value*0.9); S.money+=r; S.vehicles=S.vehicles.filter(x=>x.id!==v.id);
    log(`Tu as vendu ${v.name} pour ${money(r)}.`,"good"); save(); close(); renderGame(); showVehiclesModal();}}]}));
  const shop=VEHICLE_CATALOG.map(v=>({icon:VEH_META[v.type][0],hue:{velo:120,scooter:160,citadine:200,berline:220,suv:250,sportive:0,luxe:280}[v.type],name:v.name,price:v.value,meta:VEH_META[v.type][2],actions:v.value<3000?[{label:S.money>=v.value?"Acheter":"Trop cher",primary:true,disabled:S.money<v.value,fn:(close)=>{
    if(S.money<v.value) return; S.money-=v.value; S.vehicles.push({id:cuid(),name:v.name,type:v.type,value:v.value,km:0,lastControl:S.age});
    S.happiness=clamp(S.happiness+8); log(`Tu as acheté : ${v.name}.`,"good"); save(); close(); renderGame(); showVehiclesModal();}}]:[
    {label:"Comptant",primary:true,disabled:S.money<v.value,fn:(close)=>{
      if(S.money<v.value) return; S.money-=v.value; S.vehicles.push({id:cuid(),name:v.name,type:v.type,value:v.value,km:0,lastControl:S.age});
      S.happiness=clamp(S.happiness+8); log(`Tu as acheté comptant : ${v.name}.`,"good"); save(); close(); renderGame(); showVehiclesModal();}},
    {label:"En plusieurs fois",fn:(close)=>{
      const down=Math.floor(v.value*0.2); if(S.money<down){ log("Pas assez d'argent pour l'apport (20%).","bad"); close(); render(); return; }
      const t=vehicleLoanTerms(v.value); S.money-=down; startLoan("Crédit auto — "+v.name, v.value-down, t.y, t.r);
      S.vehicles.push({id:cuid(),name:v.name,type:v.type,value:v.value,km:0,lastControl:S.age});
      S.happiness=clamp(S.happiness+8); log(`Tu as financé : ${v.name} (apport ${money(down)}, crédit sur ${t.y} ans).`,"good"); save(); close(); renderGame(); showVehiclesModal();}}
  ]}));
  showCatalog({title:"Garage",sub:`Solde : ${money(S.money)}`,sections:[{title:owned.length?"Ta collection":"",items:owned},{title:"Concessionnaire",items:shop}]});
}

function showHousingModal(){
  const net=S.job?Math.floor(S.salary*0.82):0;
  const cur=S.housing?[{icon:(HOUSE_META[S.housing.type]||["home"])[0],hue:150,name:S.housing.name,badge:S.housing.rented?"Locataire":"Propriétaire",meta:S.housing.rented?`Loyer ${money(S.housing.rentYear)}/an`:`Valeur du marché ${money(S.housing.value)}`,actions:S.housing.rented?[{label:"Quitter",danger:true,fn:(close)=>{S.housing=null;log("Tu as quitté ton logement. Retour chez tes parents.");save();close();renderGame();}}]:[{label:"Vendre "+money(S.housing.value),danger:true,fn:(close)=>{sellCurrentHousing();save();close();renderGame();}}]}]:[];
  const shop=HOUSING_CATALOG.map(h=>{
    const down=Math.floor(h.value*0.2);
    const pct=net? Math.round(h.rentYear/net*100):null;
    return {icon:HOUSE_META[h.type][0],hue:HOUSE_META[h.type][1],name:h.name,price:h.value,
      meta:`Loyer ${money(h.rentYear)}/an${pct!==null?` (${pct}% de ton salaire net)`:""}<br>Apport achat : ${money(down)}`,
      actions:[
        {label:"Louer",fn:(close)=>{ if(S.housing && !S.housing.rented) sellCurrentHousing(); S.housing={name:h.name,type:h.type,value:h.value,rented:true,rentYear:h.rentYear}; log(`Tu emménages en location : ${h.name}.`,"good"); save(); close(); renderGame(); }},
        {label:"Acheter",primary:true,disabled:S.money<down,fn:(close)=>{
          if(S.money<down) return; if(S.housing && !S.housing.rented) sellCurrentHousing();
          S.money-=down; const principal=h.value-down;
          if(principal>0) S.loans.push({id:cuid(),kind:"Prêt immobilier — "+h.name,balance:principal,rate:0.035,yearlyPayment:Math.floor(principal/20*1.35)});
          S.housing={name:h.name,type:h.type,value:h.value,rented:false}; S.happiness=clamp(S.happiness+15);
          log(`Tu es devenu(e) propriétaire : ${h.name} (apport ${money(down)}, crédit sur 20 ans).`,"good"); mark(`Achat d'un logement : ${h.name}.`); save(); close(); renderGame(); }}
      ]};
  });
  showCatalog({title:"Logement",sub:S.housing?"Ton logement actuel ci-dessous":"Tu vis encore chez tes parents",sections:[{title:cur.length?"Chez toi":"",items:cur},{title:"Annonces",items:shop}]});
}
function sellCurrentHousing(){
  if(!S.housing || S.housing.rented) return;
  S.money += S.housing.value;
  log(`Tu as vendu ton bien : ${S.housing.name} (+${money(S.housing.value)}).`,"good");
  S.housing=null;
}

function tryExpatriate(){
  const newCity=pick(CITIES.filter(c=>c!==S.city));
  if(S.money<3000){ log("Il te faut au moins 3 000 € pour t'expatrier.","bad"); return; }
  S.money-=3000; const oldCity=S.city; S.city=newCity;

function socialMediaYearly(pushY){
  if(!S.social.active) return;
  const churn=Math.floor(S.social.followers*rnd(-3,5)/100);
  S.social.followers=Math.max(0,S.social.followers+churn);
  if(S.social.followers>=5000 && rnd(1,100)<=8){
    S.repMedia=clamp(S.repMedia+3); S.happiness=clamp(S.happiness+4);
    pushY("Quelqu'un t'a reconnu(e) dans la rue grâce à tes réseaux.","good");
  }
}
function joinSocialMedia(){
  S.social.active=true; S.social.handle="@"+S.firstName.toLowerCase()+rnd(10,999);
  S.social.followers=rnd(20,80);
  log(`Tu as créé ton compte ${S.social.handle}.`,"good"); 
}
function postContent(){
  const base=5+Math.floor(S.creativity/8)+Math.floor(S.sociability/10);
  S.social.posts++;
  const viral=rnd(1,100)<=Math.max(2,Math.floor(S.social.followers/50));
  if(viral){
    const gain=rnd(500,8000); S.social.followers+=gain; S.repMedia=clamp(S.repMedia+8); S.happiness=clamp(S.happiness+10);
    log(`Une de tes publications devient virale ! +${gain.toLocaleString('fr-FR')} abonnés.`,"good");
  } else {
    const gain=rnd(0,base*3); S.social.followers+=gain;
    if(rnd(1,100)<=8){ S.repMedia=clamp(S.repMedia-10); S.happiness=clamp(S.happiness-8); S.social.followers=Math.max(0,S.social.followers-rnd(50,300)); log("Bad buzz : ta publication a mal tourné.","bad"); }
    else log(`Publication postée : +${gain} abonnés.`,"good");
  }
}
function seekSponsor(){
  if(S.social.followers<1000){ log("Il te faut au moins 1 000 abonnés pour attirer des sponsors.","bad"); return; }
  if(rnd(1,100)<=50+Math.floor(S.repMedia/4)){
    const gain=Math.floor(S.social.followers*rnd(2,8)/100); S.money+=gain; S.repMedia=clamp(S.repMedia+2);
    log(`Contrat de sponsoring décroché : +${money(gain)}.`,"good");
  } else log("Aucune marque n'a répondu à ta proposition.","bad");
}
function harassmentEvent(){
  S.happiness=clamp(S.happiness-rnd(8,16)); S.stress=clamp(S.stress+rnd(6,12));
  log("Tu subis une vague de harcèlement en ligne.","bad");
}

/* ================= SANTÉ APPROFONDIE ================= */
const CONDITIONS=[
  {n:"Hypertension",trig:s=>s.stress>=65||s.age>=50,base:2,icon:"heart-pulse"},
  {n:"Anxiété chronique",trig:s=>s.stress>=70,base:3,icon:"brain"},
  {n:"Douleurs chroniques au dos",trig:s=>s.age>=45,base:2,icon:"bone"},
  {n:"Diabète de type 2",trig:s=>s.diet==="mauvaise"&&s.age>=35,base:2,icon:"syringe"},
  {n:"Insomnie",trig:s=>s.stress>=60,base:2,icon:"bed"},
];
function maybeGetSick(pushY){
  CONDITIONS.forEach(c=>{
    if(S.conditions.find(x=>x.n===c.n)) return;
    if(c.trig(S) && rnd(1,1000)<=c.base){
      S.conditions.push({n:c.n,since:S.age});
      S.health=clamp(S.health-rnd(4,10));
      pushY(`Diagnostic : ${c.n}.`,"bad");
    }
  });
  if(S.conditions.length){
    let cost=S.conditions.length*rnd(200,500);
    if(S.healthInsurance) cost=Math.floor(cost*0.25);
    S.money-=cost; addFin("Traitement médical (conditions chroniques)",-cost);
  }
}
function accidentAndHospital(pushY){
  const risk=1+(S.job&&/pompier|policier|militaire|maçon|mécanicien/i.test(S.jobTitle||"")?2:0);
  if(rnd(1,100)<=risk){
    const sev=rnd(1,100);
    const days=sev<=60?rnd(1,3):sev<=90?rnd(4,10):rnd(10,25);
    let cost=days*rnd(150,300);
    if(S.healthInsurance) cost=Math.floor(cost*0.2);
    S.money-=cost; S.health=clamp(S.health-Math.floor(days*1.5));
    addFin("Hospitalisation",-cost);
    pushY(`Hospitalisation de ${days} jour(s) suite à un accident : ${money(cost)}.`,"bad");
    if(S.job && days>=10){ endJob(); pushY("Un arrêt de travail prolongé t'a coûté ton emploi.","bad"); }
  }
}
function buyHealthInsurance(){
  if(S.healthInsurance){ S.healthInsurance=false; log("Tu as résilié ton assurance santé.","bad"); return; }
  S.healthInsurance=true;
  log("Tu as souscrit une assurance santé : elle réduit fortement tes frais médicaux, moyennant une prime annuelle.","good");
}

function relationshipDrift(pushY){
  // amis qui s'éloignent si négligés
  if(S.friends.length){
    S.friends = S.friends.filter(f=>{
      if(rnd(1,100)<=6){
        pushY(`${f.name} s'est éloigné(e) : vous vous êtes perdu(e)s de vue.`,"bad");
        S.happiness=clamp(S.happiness-3);
        return false;
      }
      return true;
    });
  }
  // rupture ou divorce à l'initiative du/de la partenaire
  if(S.relationship && rnd(1,100)<=(S.married?2:5)){
    const who=S.relationship;
    S.happiness=clamp(S.happiness-(S.married?18:10));
    S.relationship=null; S.married=false;
    pushY(`${who} a mis fin à votre relation. Tu ne t'y attendais pas.`,"bad");
    mark(`${who} a rompu avec toi.`);
  }
  // agression rare
  if(rnd(1,1000)<=1){
    const survived=rnd(1,100)<=93;
    const hurt=rnd(15,35);
    S.health=clamp(S.health-hurt); S.stress=clamp(S.stress+15);
    if(survived){ pushY("Tu as été agressé(e) dans la rue. Tu t'en sors blessé(e) mais vivant(e).","bad"); mark("A survécu à une agression."); }
    else { S.deathCause="Agression"; S.health=0; pushY("Tu as été mortellement agressé(e) dans la rue.","bad"); mark("Mort(e) des suites d'une agression."); }
  }
}
function checkAchievements(pushY){

    if(a.cond(S)){ S.achievements.push(a.id); S.happiness=clamp(S.happiness+4); pushY(`Succès débloqué : ${a.label}.`,"good"); mark(`Succès débloqué : ${a.label}.`); }

function processStudies(pushY){
  if(!S.studyLevel) return;
  S.studyYears++; S.smarts=clamp(S.smarts+rnd(1,3));
  if(S.scholarship){ /* bourse : scolarité gratuite */ }
  else if(S.parentsFunding){ /* parents paient */ }
  else { S.money-=800; if(window.__fin) window.__fin.push({label:'Frais de scolarité',amt:-800}); }
  const dur=STUDY_DUR[S.studyLevel];
  if(S.studyYears<dur){ pushY(`Année ${S.studyYears}/${dur} de ${S.studyLevel} en ${S.major} validée.`,"good"); return; }
  const diffF=(FIELD_META[S.major]||[0,0,2])[2]; const score=S.smarts*0.6+S.discipline*0.3+rnd(-10,15)-(diffF-2)*6;
  if(score>=45){
    const mention=score>=75?"Très bien":score>=62?"Bien":score>=52?"Assez bien":"Passable";
    S.degrees.push({field:S.major,level:S.studyLevel,mention,age:S.age});
    S.eduStage=4+({Licence:1,Master:2,Doctorat:3}[S.studyLevel]);
    S.happiness=clamp(S.happiness+12); S.reputation=clamp(S.reputation+4);
    pushY(`Diplôme obtenu : ${S.studyLevel} en ${S.major} — mention ${mention} !`,"good"); mark(`Diplôme obtenu : ${S.studyLevel} en ${S.major} (mention ${mention}).`);
    S.studyLevel=null; S.studyYears=0; S.scholarship=false; S.parentsFunding=false;
  } else {
    S.studyFails++;
    if(S.studyFails>=2){ pushY(`Second échec aux examens : tu abandonnes ${S.major}.`,"bad"); S.studyLevel=null;S.studyYears=0;S.major=null;S.happiness=clamp(S.happiness-15);S.scholarship=false;S.parentsFunding=false; }
    else { S.studyYears=dur-1; S.happiness=clamp(S.happiness-10); pushY(`Échec aux examens de ${S.studyLevel} : redoublement.`,"bad"); }
  }
}

function endJob(reason){
  const h=S.jobHistory[S.jobHistory.length-1]; if(h && !h.to) h.to=S.age;

}
function applyJob(j){
  const chance = Math.max(5, 40 + Math.floor(S.smarts/5) + Math.floor(S.looks/10) + Math.floor((S.sociability||50)/12) - recordPenalty());
  if(rnd(1,100) <= chance){
    S.job = true; S.jobTitle=j.title; S.salary = rnd(j.salary[0], j.salary[1]); S.stress=clamp(S.stress+5); S.jobHistory.push({title:j.title,from:S.age,to:null}); mark(`Embauché(e) comme ${j.title}.`);
    log(`Entretien réussi ! Tu as été embauché(e) comme ${j.title}, salaire ${money(S.salary)}/an.`,"good");
  } else {
    log(`Entretien décevant : ta candidature pour ${j.title} a été refusée.`,"bad");
    S.happiness=clamp(S.happiness-3);
  }
}

  } else {

function askRaise(){
  if(rnd(1,100)<=35+Math.floor(S.smarts/8)){
    const inc=Math.floor(S.salary*rnd(5,15)/100);
    S.salary+=inc; log(`Ton patron a accepté : +${money(inc)}/an.`,"good");

function invest(){
  if(S.money<100){ log("Pas assez d'argent pour investir.","bad"); return; }
  const amt=Math.min(S.money, rnd(100,2000));
  if(rnd(1,100)<=48){ const gain=Math.floor(amt*rnd(10,60)/100); S.money+=gain; log(`Bon placement en bourse ! +${money(gain)}.`,"good"); }
  else { const loss=Math.floor(amt*rnd(10,50)/100); S.money-=loss; log(`Le marché a chuté... -${money(loss)}.`,"bad"); }
}
function gamble(){
  if(S.money<50){ log("Pas assez d'argent pour jouer.","bad"); return; }
  const bet=Math.min(S.money, rnd(50,500));
  if(rnd(1,100)<=40){ const win=bet*2; S.money+=win; log(`Jackpot au casino ! +${money(win)}.`,"good"); }
  else { S.money-=bet; log(`Tu as tout perdu au casino... -${money(bet)}.`,"bad"); S.happiness=clamp(S.happiness-6); }
}

const GANG_NAMES=["Les Corbeaux","Le Clan Mazarin","La Fraternité Noire","Le Syndicat des Docks","Les Vipères","Le Cartel de la Côte"];
const GANG_RANKS=["Recrue","Soldat","Lieutenant","Capitaine","Parrain"];
const RESTRICTED_JOBS=/policier|pompier|militaire|avocat|associé|médecin|chirurg|interne|professeur|parlementaire|chargé de mission|juge/i;
function heat(base){ return clamp(base - Math.floor(S.smarts/10) + (S.criminalRecord?8:0) + (S.fugitive?10:0) - (S.gang?S.gang.rank*2:0)); }
function crimeRepUp(n){ S.crimeRep=clamp((S.crimeRep||0)+n); }
function recordPenalty(){ if(!S.criminalRecord) return 0; return Math.max(0, 15+10*Math.min(3,(S.record||[]).length)-5*(S.reinsert||0)); }

function arrest(crime, years){
  if(S.age<18) years=Math.min(years,2);
  const life=years>=30;
  const mk=(emoji,hue,name,cost,q,meta,plea)=>({icon:emoji,hue,name,priceText:cost?money(cost):"Gratuit",price:cost,meta,actions:[{label:"Choisir",primary:true,disabled:S.money<cost,fn:(close)=>{close();trial(crime,years,q,cost,!!plea);}}]});
  const items=[
    mk("clipboard",210,"Avocat commis d'office",0,0.12,"Défense limitée, mais gratuite."),
    mk("briefcase",45,"Avocat privé",5000,0.3,"Une bonne défense."),
    mk("star",280,"Avocat de renom",30000,0.55,"Défense d'élite, résultats redoutables."),
    mk("gavel",150,"Plaider coupable",0,0,"Aucune chance d'acquittement, mais peine réduite d'environ 40 %.",true)
  ];
  setTimeout(()=>showCatalog({locked:true,icon:"gavel",title:"Arrestation",sub:`Tu es poursuivi(e) pour : ${crime}. Peine encourue : ${life?"réclusion à perpétuité":years+" an(s)"}.`,sections:[{title:"Choisis ta défense",items}]}),0);
}
function trial(crime,years,q,cost,plea){
  S.money-=cost;
  const sev=Math.min(1,years/25);
  const acq=plea?0:Math.max(0,Math.min(0.7,q*(1-sev*0.55)+(S.smarts-50)/500));
  if(Math.random()<acq){
    log(`Procès (${crime}) : tu es acquitté(e) !`,"good"); S.happiness=clamp(S.happiness+5); S.stress=clamp(S.stress-10);
  } else {
    let sentence=Math.max(1,Math.round(years*(plea?0.6:(1-q*0.35))*rnd(75,105)/100));
    S.jailYears=sentence; S.criminalRecord=true; S.cleanYears=0; S.behavior=0;
    (S.record=S.record||[]).push({age:S.age,crime,years:sentence}); mark(`Condamné(e) pour ${crime} : ${sentence} an(s) de prison.`);
    S.happiness=clamp(S.happiness-15); S.reputation=clamp(S.reputation-15); S.repSocial=clamp(S.repSocial-15); S.karma=clamp(S.karma-5);
    if(S.job) endJob();
    log(`Procès (${crime}) : condamné(e) à ${sentence>=30?"la réclusion à perpétuité":sentence+" an(s) de prison"}.`,"bad");
  }
  checkDeathMidYear(); save(); renderGame();
}

function shoplift(){
  const gain=rnd(20,150);
  if(rnd(1,100)<=heat(20)){
    if(rnd(1,100)<=60){ const f=rnd(100,400); S.money-=f; S.happiness=clamp(S.happiness-6); S.karma=clamp(S.karma-5); S.reputation=clamp(S.reputation-5); log(`Pris(e) par un vigile : amende de ${money(f)} et avertissement.`,"bad"); }
    else arrest("Vol",1);
  } else { S.money+=gain; S.karma=clamp(S.karma-4); crimeRepUp(2); log(`Vol discret : tu empoches ${money(gain)}.`,"good"); }
}
function vandalism(){
  if(rnd(1,100)<=heat(25)){ if(rnd(1,100)<=65){ const f=rnd(150,600); S.money-=f; S.reputation=clamp(S.reputation-6); log(`Surpris(e) en train de dégrader du mobilier : amende de ${money(f)}.`,"bad"); } else arrest("Vandalisme",1); }
  else { S.happiness=clamp(S.happiness+5); S.karma=clamp(S.karma-4); crimeRepUp(3); log("Tu as laissé ta marque en ville. Personne ne t'a vu.","good"); }
}

function burglary(){
  const gain=rnd(500,4000);
  if(rnd(1,100)<=heat(40)) arrest("Cambriolage",rnd(2,5));

function commitCrime(){
  const gain=rnd(1500,12000);
  if(rnd(1,100)<=heat(45)) arrest("Braquage de magasin",rnd(4,9));
  else { S.money+=gain; S.karma=clamp(S.karma-15); S.stress=clamp(S.stress+8); crimeRepUp(8); log(`Braquage réussi : ${money(gain)} de butin.`,"good"); }
}
function bankHeist(){
  let share=1;
  if(!S.gang){
    if(S.money<3000){ log("Il te faut 3 000 € pour recruter une équipe.","bad"); return; }
    S.money-=3000; share=0.6;
  }
  const loot=Math.floor(rnd(60000,450000)*share);
  if(rnd(1,100)<=heat(55)) arrest("Braquage de banque",rnd(10,22));
  else { S.money+=loot; S.karma=clamp(S.karma-20); S.stress=clamp(S.stress+12); crimeRepUp(15); if(S.gang) S.gang.respect+=15; log(`Le coup du siècle : ${money(loot)} de butin !`,"good"); }
}
function bigCrime(){
  const gain=Math.floor(rnd(3000,18000)*(S.gang?1+S.gang.rank*0.3:1));
  if(rnd(1,100)<=heat(45)) arrest("Trafic illégal",rnd(5,14));
  else { S.money+=gain; S.karma=clamp(S.karma-20); crimeRepUp(10); log(`Une opération lucrative : ${money(gain)}.`,"good"); }
}

/* ---- meurtre (abstrait : probabilités et conséquences uniquement) ---- */
function murderTargets(){
  const t=[];
  if(S.father.alive) t.push({k:"father",g:"Famille",label:"Ton père — "+S.father.name,rel:"family",ref:S.father});
  if(S.mother.alive) t.push({k:"mother",g:"Famille",label:"Ta mère — "+S.mother.name,rel:"family",ref:S.mother});
  S.siblings.forEach((s,i)=>t.push({k:"sib"+i,g:"Famille",label:"Frère/sœur — "+s.name,rel:"family",ref:s,idx:i,type:"sib"}));
  (S.grandparents||[]).forEach((g,i)=>{ if(g.alive!==false) t.push({k:"gp"+i,g:"Famille",label:"Grand-parent — "+g.name,rel:"family",ref:g}); });
  (S.auntsUncles||[]).forEach((u,i)=>{ if(u.alive!==false) t.push({k:"au"+i,g:"Famille",label:"Oncle/tante — "+u.name,rel:"family",ref:u}); });
  if(S.relationship) t.push({k:"partner",g:"Entourage",label:(S.married?"Ton/ta conjoint(e)":"Ton/ta partenaire")+" — "+S.relationship,rel:"partner"});
  if(S.job) t.push({k:"boss",g:"Entourage",label:"Ton patron ("+S.jobTitle+")",rel:"work"});
  t.push({k:"rival",g:"Entourage",label:"Un rival de longue date",rel:"other"});
  t.push({k:"stranger",g:"Inconnus",label:"Un inconnu croisé au hasard",rel:"stranger"});
  t.push({k:"criminal",g:"Inconnus",label:"Un criminel notoire",rel:"stranger",lighter:true});
  return t;
}
function showMurderModal(){
  const T=murderTargets();
  const groups={}; T.forEach(x=>{ (groups[x.g]=groups[x.g]||[]).push(x); });
  const opts=Object.keys(groups).map(g=>`<optgroup label="${g}">${groups[g].map(x=>`<option value="${x.k}">${x.label}</option>`).join("")}</optgroup>`).join("");
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal sheet"><button class="close-x" id="mClose" type="button">${icon('x',22)}</button>
    <h3><span class="hic">${icon('skull',22)}</span>Une décision irréversible</h3>
    <p class="sub">Cet acte changera ta vie et celle de tes proches à jamais. Les conséquences sont lourdes, quelle que soit l'issue.</p>
    <div class="sec-t">Cible</div><select class="sel" id="mTarget">${opts}</select>
    <div class="sec-t">Approche</div>
    <select class="sel" id="mApproach">
      <option value="discrete">Discrète — moins de risques d'être repéré(e), réussite moyenne</option>
      <option value="brutal">Brutale — réussite quasi certaine, très voyant</option>
      <option value="accident">Mise en scène d'accident — très discret, difficile</option>
    </select>
    <button class="bigbtn" id="mGo" type="button" style="background:var(--bad);color:#2a0a10;margin-top:6px;">Passer à l'acte</button>
    <button class="bigbtn secondary" id="mNo" type="button" style="margin-top:10px;">Renoncer</button></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',(e)=>{ if(e.target===bg) close(); });
  bg.querySelector('#mClose').addEventListener('click',close);
  bg.querySelector('#mNo').addEventListener('click',close);
  bg.querySelector('#mGo').addEventListener('click',()=>{
    const key=bg.querySelector('#mTarget').value, ap=bg.querySelector('#mApproach').value;
    const tg=T.find(x=>x.k===key); close(); doMurder(tg,ap); checkDeathMidYear(); save(); renderGame();
  });
}
function doMurder(tg,approach){
  const AP={discrete:{s:55,d:35},brutal:{s:80,d:70},accident:{s:45,d:25}}[approach];
  const succ=clamp(AP.s+(S.smarts-50)/5+(S.courage-50)/10);
  if(rnd(1,100)>succ){
    S.stress=clamp(S.stress+20); crimeRepUp(5);
    log(`Ta tentative contre « ${tg.label} » a échoué.`,"bad");
    if(rnd(1,100)<=Math.min(95,AP.d+25)) arrest("Tentative de meurtre",rnd(6,15));
    return;
  }
  // la cible disparaît du monde de la partie
  if(tg.k==="father") S.father.alive=false; else if(tg.k==="mother") S.mother.alive=false;
  else if(tg.type==="sib") S.siblings=S.siblings.filter(s=>s!==tg.ref);
  else if(tg.ref) tg.ref.alive=false;
  else if(tg.k==="partner"){ S.relationship=null; S.married=false; S.partner=null; }
  if(tg.rel==="family"||tg.rel==="partner"){
    [S.father,S.mother,...S.siblings].forEach(p=>{ if(p && p.alive!==false && p!==tg.ref) remember(p,"La mort d'un membre de la famille reste entourée de zones d'ombre.",-25); });
  }
  S.karma=clamp(S.karma-(tg.lighter?15:40)); S.stress=clamp(S.stress+30);
  S.happiness=clamp(S.happiness-Math.max(5,Math.floor(30-S.empathy/4))); crimeRepUp(15);
  log(`« ${tg.label} » est mort(e). Rien ne sera plus jamais pareil.`,"bad"); mark(`A causé la mort de ${tg.label}.`);
  const suspect=AP.d+((tg.rel==="family"||tg.rel==="partner")?15:0)+(S.criminalRecord?8:0)-Math.floor(S.smarts/6);
  if(rnd(1,100)<=suspect) arrest("Meurtre",rnd(18,32));
  else { S.coldCase=true; log("Personne ne te soupçonne… pour l'instant.","bad"); }
}

/* ---- organisation criminelle ---- */
function joinGang(){
  if(S.crimeRep<10 && S.courage<50){ log("Personne ne veut de toi : tu n'as aucune réputation dans la rue.","bad"); return; }
  if(rnd(1,100)<=clamp(45+S.crimeRep/2+(S.courage-50)/4)){ S.gang={name:pick(GANG_NAMES),rank:0,respect:0}; crimeRepUp(5); S.karma=clamp(S.karma-5); log(`Tu es accepté(e) dans « ${S.gang.name} » en tant que recrue.`,"good"); mark(`A rejoint l'organisation « ${S.gang.name} ».`); }
  else log("L'organisation t'a écarté(e). Reviens quand tu auras fait tes preuves.","bad");
}
function gangMission(){
  const g=S.gang, gain=Math.floor(rnd(1500,6000)*(1+g.rank*0.6));
  if(rnd(1,100)<=heat(30)) arrest("Activités criminelles organisées",rnd(3,8));
  else { S.money+=gain; g.respect+=rnd(6,14); crimeRepUp(4); S.karma=clamp(S.karma-8); log(`Mission accomplie pour « ${g.name} » : ${money(gain)}.`,"good"); }
}
function gangPromotion(){
  const g=S.gang;
  if(g.rank>=4){ log("Tu es déjà au sommet de l'organisation.","good"); return; }
  if(g.respect>=25*(g.rank+1) && rnd(1,100)<=60+S.ambition/5){ g.rank++; g.respect=0; log(`Promotion : tu deviens ${GANG_RANKS[g.rank]} de « ${g.name} ».`,"good"); }
  else log("Tu n'as pas encore assez de respect pour monter en grade.","bad");
}
function leaveGang(){
  const n=S.gang.name;
  if(rnd(1,100)<=55) log(`Tu quittes « ${n} » sans encombre.`);
  else { S.health=clamp(S.health-rnd(15,30)); S.money-=rnd(1000,5000); log(`Représailles de « ${n} » : tu es blessé(e) et dépouillé(e).`,"bad"); }
  S.gang=null;
}

/* ---- prison, évasion, réinsertion ---- */
function prisonActions(A){
  A.vie.push({label:"Se faire discret", sub:"+bonne conduite, -stress", fn:()=>doAction(()=>{ S.behavior=(S.behavior||0)+1; S.stress=clamp(S.stress-6); log("Tu fais profil bas et tu évites les ennuis.","good"); })});
  A.vie.push({label:"Travailler à l'atelier", sub:"+argent, +bonne conduite", fn:()=>doAction(()=>{ const g=rnd(200,700); S.money+=g; S.behavior=(S.behavior||0)+1; log(`Travail en atelier : ${money(g)} gagnés.`,"good"); })});
  A.vie.push({label:"Suivre une formation", sub:"+intelligence, aide la réinsertion", fn:()=>doAction(()=>{ S.smarts=clamp(S.smarts+rnd(2,5)); S.behavior=(S.behavior||0)+1; S.reinsert=(S.reinsert||0)+1; log("Tu suis une formation qualifiante en détention.","good"); })});
  if(!S.prisonGang) A.vie.push({label:"Rejoindre un gang de prison", sub:"Protection, mais mauvaise réputation", danger:true, fn:()=>doAction(()=>{ S.prisonGang=true; crimeRepUp(8); S.karma=clamp(S.karma-6); S.behavior=Math.max(0,(S.behavior||0)-1); log("Tu te places sous la protection d'un gang de la prison.","bad"); })});
  A.vie.push({label:"Se bagarrer", sub:"Risque de blessure et de sanction", danger:true, fn:()=>doAction(()=>{ S.behavior=Math.max(0,(S.behavior||0)-2); if(rnd(1,100)<=50){ S.health=clamp(S.health-rnd(8,20)); log("Tu t'es battu(e) et tu es blessé(e).","bad"); } else { crimeRepUp(3); log("Tu t'es imposé(e) dans la cour.","good"); } })});
  A.vie.push({label:"Demander la libération conditionnelle", sub:"Selon ta conduite", fn:()=>doAction(()=>{
    const chance=(S.behavior||0)>=3?20+(S.behavior||0)*6:5;
    if(rnd(1,100)<=chance){ S.jailYears=0; S.behavior=0; S.prisonGang=false; S.cleanYears=0; log("Libération conditionnelle accordée : tu sors de prison.","good"); }
    else { S.happiness=clamp(S.happiness-6); log("Ta demande de libération conditionnelle est rejetée.","bad"); }
  })});
  A.vie.push({label:"Tenter de s'évader", sub:"Très risqué", danger:true, wide:true, fn:()=>doAction(()=>{
    const chance=clamp(12+S.smarts/6+S.courage/8);
    if(rnd(1,100)<=chance){ S.escapedRemaining=S.jailYears; S.jailYears=0; S.fugitive=true; S.behavior=0; S.prisonGang=false; if(S.job) endJob(); crimeRepUp(10); S.karma=clamp(S.karma-10); log("Évasion réussie ! Tu es désormais en cavale.","good"); mark("Évasion de prison."); }
    else { const add=rnd(2,4); S.jailYears+=add; S.behavior=0; S.health=clamp(S.health-rnd(8,18)); log(`Évasion ratée : ${add} ans de peine ajoutés.`,"bad"); }
  })});
}
function reinsertionActions(A){
  if(S.fugitive) A.vie.push({label:"Se rendre à la police", sub:"Mettre fin à la cavale", wide:true, fn:()=>doAction(()=>{ S.fugitive=false; S.jailYears=Math.max(1,(S.escapedRemaining||1)); log(`Tu te rends. Tu retournes en prison pour ${S.jailYears} an(s).`,"bad"); })});
  if(S.criminalRecord && !S.fugitive){
    A.vie.push({label:"Programme de réinsertion", sub:"Améliore tes chances d'emploi", fn:()=>doAction(()=>{ S.reinsert=(S.reinsert||0)+1; S.reputation=clamp(S.reputation+4); S.repPro=clamp(S.repPro+5); S.stress=clamp(S.stress-4); log("Tu suis un programme de réinsertion professionnelle.","good"); })});
    if((S.cleanYears||0)>=7) A.vie.push({label:"Demander la réhabilitation", sub:"Effacer ton casier judiciaire", fn:()=>doAction(()=>{
      if(rnd(1,100)<=70){ S.criminalRecord=false; S.record=[]; S.reputation=clamp(S.reputation+10); S.repSocial=clamp(S.repSocial+15); log("Ton casier judiciaire est effacé.","good"); }
      else log("Ta demande de réhabilitation est refusée.","bad");
    })});
  }
}
function ombreActions(A){
  if(S.age<14) return;
  A.ombre.push({label:"Voler à l'étalage", sub:"Petit risque, petit gain", fn:()=>doAction(shoplift)});
  A.ombre.push({label:"Vandalisme", sub:"Un coup d'éclat", fn:()=>doAction(vandalism)});
  if(S.age>=18) A.ombre.push({label:"Fraude / arnaque", sub:"Gain moyen, risque moyen", fn:()=>doAction(fraud)});
  A.ombre.push({label:"Cambriolage", sub:"Risque moyen, gain correct", danger:true, fn:()=>doAction(burglary)});
  A.ombre.push({label:"Braquer un magasin", sub:"Très risqué, gros gain", danger:true, fn:()=>doAction(commitCrime)});
  if(S.age>=20) A.ombre.push({label:"Braquer une banque", sub:"Équipe requise · énorme butin", danger:true, fn:()=>doAction(bankHeist)});
  if(S.age>=16) A.ombre.push({label:"Trafic illégal", sub:"Extrêmement risqué", danger:true, fn:()=>doAction(bigCrime)});
  if(S.age>=16) A.ombre.push({label:"Préparer un meurtre", sub:"Irréversible · choisis ta cible", danger:true, wide:true, fn:showMurderModal});
  if(S.age>=16){
    if(!S.gang) A.ombre.push({label:"Rejoindre une organisation", sub:"Crime organisé", wide:true, fn:()=>doAction(joinGang)});
    else {
      A.ombre.push({label:"Mission pour l'organisation", sub:GANG_RANKS[S.gang.rank]+" · respect "+S.gang.respect, fn:()=>doAction(gangMission)});

    }
  }
}

function makePartner(name){
  return {name, closeness:rnd(55,75), memory:[], job:pick(NPC_JOBS.filter(j=>j!=="sans emploi")), wealth:"stable", mood:rnd(55,80), life:[], lastSeen:S.age};
}
function seekLove(){
  const chance = 30 + Math.floor(S.looks/3) + Math.floor(S.sociability/8);
  if(rnd(1,100)<=chance){
    const partner = randomPerson(S.sex==="F"?"M":"F");
    S.relationship = partner; S.partner=makePartner(partner); S.married=false; S.happiness=clamp(S.happiness+12);
    log(`Tu as rencontré ${partner} et vous êtes maintenant en couple.`,"good");
  } else { log("Aucune rencontre intéressante cette fois-ci."); }
}

function meetSomeone(){
  const roll=rnd(1,100);
  if(roll<=22){
    if(rnd(1,100)<=60){ S.happiness=clamp(S.happiness+4); log("Un inconnu t'a abordé(e) pour une discussion sympathique.","good"); }
    else { const loss=rnd(20,150); S.money=Math.max(0,S.money-loss); log(`Un inconnu t'a accosté(e) et t'a soutiré ${money(loss)}.`,"bad"); }
  } else if(roll<=48){
    const name=randomPerson(Math.random()<0.5?"M":"F");
    if(S.friends.find(f=>f.name===name)){ log("Tu as croisé une connaissance sans plus."); return; }
    S.friends.push({id:cuid(),name,closeness:rnd(40,60),memory:[]}); S.happiness=clamp(S.happiness+5);
    log(`${name} t'a proposé son amitié. Vous êtes maintenant amis.`,"good");
  } else if(roll<=68 && S.age>=16 && !S.relationship && !S.married){
    const partner=randomPerson(S.sex==="F"?"M":"F");
    if(rnd(1,100)<=40+Math.floor(S.looks/6)){ S.relationship=partner; S.partner=makePartner(partner); S.happiness=clamp(S.happiness+10); log(`${partner} t'a abordé(e) dans la rue. Le courant passe, vous êtes en couple.`,"good"); }
    else log(`${partner} t'a abordé(e), mais ça n'a pas matché.`);
  } else if(roll<=88 && S.age>=16){
    const name=randomPerson(Math.random()<0.5?"M":"F");
    S.network.push({id:cuid(),name,role:"Contact professionnel",closeness:rnd(30,55),memory:[]});
    log(`Tu as rencontré ${name}, un contact professionnel intéressant.`,"good");
  } else { log("Une sortie tranquille, sans rencontre marquante."); }
}

function networkAction(){
  const all=[...S.friends,...S.network];
  if(!all.length){ log("Tu n'as encore personne dans ton cercle. Sors rencontrer du monde !","bad"); return; }
  const c=pick(all); const isNet=S.network.includes(c);
  remember(c, isNet?"Vous avez échangé sur vos carrières.":"Vous avez passé du temps ensemble.", rnd(3,7));
  S.happiness=clamp(S.happiness+3);
  if(isNet && !S.job && rnd(1,100)<=30){
    const jobs=availableJobs();
    if(jobs.length){ const j=pick(jobs); hireViaReferral(j,c); return; }
  }
  log(`Tu as pris des nouvelles de ${c.name}.`,"good");
}
function hireViaReferral(j,contact){
  S.job=true; S.jobTitle=j.title; S.salary=Math.floor(rnd(j.salary[0],j.salary[1])*1.05); S.stress=clamp(S.stress+5);
  S.jobHistory.push({title:j.title,from:S.age,to:null});
  log(`Grâce à ${contact.name}, tu es recommandé(e) et embauché(e) comme ${j.title} !`,"good");
  mark(`Embauché(e) comme ${j.title}, recommandé(e) par ${contact.name}.`);
}

function buildPhoneMessages(){

}
function yearlyCryptoDrift(pushY){
  if(!S.crypto) return;
  CRYPTOS.forEach(c=>{
    const trend=(Math.random()-0.48)*2;
    let mult=Math.max(0.1, 1+trend*c.vol*rnd(6,18));
    if(rnd(1,1000)<=4){ mult=rnd(5,40); pushY(`Le cours du ${c.k} explose cette année !`,"good"); }
    else if(rnd(1,1000)<=4){ mult=rnd(5,30)/100; pushY(`Le ${c.k} s'effondre cette année.`,"bad"); }
    S.crypto.prices[c.k]=Math.max(c.base*0.002, S.crypto.prices[c.k]*mult);
    const h=S.crypto.history[c.k]; h.push(S.crypto.prices[c.k]); if(h.length>60) h.shift();
  });
  const holds=S.crypto.holdings;
  const big=Object.keys(holds).find(k=> holds[k].amt>0 && Math.abs((S.crypto.prices[k]*holds[k].amt)-(holds[k].cost))> holds[k].cost*0.6 );
  if(big){
    const h=holds[big]; const val=S.crypto.prices[big]*h.amt; const gain=val-h.cost;
    pushY(gain>0?`Tes ${big} ont flambé cette année : +${money(gain)} de plus-value latente.`:`Tes ${big} se sont effondrés cette année : ${money(gain)} de moins-value latente.`, gain>0?"good":"bad");
  }
}
