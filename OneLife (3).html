  let cryptoCur="BTC";
  function cryptoSvg(hist){
    const w=280,h=100,pad=4;
    const min=Math.min(...hist), max=Math.max(...hist);
    const span=(max-min)||1;
    const pts=hist.map((v,i)=>{
      const x=pad+(i/(hist.length-1))*(w-pad*2);
      const y=h-pad-((v-min)/span)*(h-pad*2);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    const up = hist[hist.length-1]>=hist[0];
    const col = up?"#5fd39a":"#e0637a";
    const last=pts.split(" ").pop();
    const fill=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
    return `<svg viewBox="0 0 ${w} ${h}" class="cchart"><polygon points="${fill}" fill="${col}" opacity=".12"></polygon><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline><circle cx="${last.split(',')[0]}" cy="${last.split(',')[1]}" r="3" fill="${col}"></circle></svg>`;
  }
  function renderCryptoApp(){
    appTitle.textContent="Crypto";
    let buyAmt=Math.min(200,Math.floor(S.money/2)||50);
    const draw=()=>{
      const price=S.crypto.prices[cryptoCur];
      const hist=S.crypto.history[cryptoCur].slice(-28);
      const first=hist[0], chgPct=((price-first)/first*100);
      const hold=S.crypto.holdings[cryptoCur];
      const holdVal=hold.amt*price;
      const pl=holdVal-hold.cost;
      const totalPortfolio = CRYPTOS.reduce((a,c)=>a+S.crypto.holdings[c.k].amt*S.crypto.prices[c.k],0);
      appBody.innerHTML = `
        <div class="cx-portfolio">Portefeuille crypto total : <b>${money(totalPortfolio)}</b></div>
        <div class="chips" style="margin:8px 0 10px;">${CRYPTOS.map(c=>`<button type="button" class="chip${c.k===cryptoCur?' on':''}" data-coin="${c.k}">${c.k}</button>`).join("")}</div>
        <div class="cx-card">
          <div class="cx-pair">${CRYPTOS.find(c=>c.k===cryptoCur).name} <span>${cryptoCur}/EUR</span></div>
          <div class="cx-price">${cryptoFmt(price)} €</div>
          <div class="cx-chg" style="color:${chgPct>=0?'#5fd39a':'#e0637a'}">${chgPct>=0?'▲':'▼'} ${Math.abs(chgPct).toFixed(2)}%</div>
          <div id="cpxChart">${cryptoSvg(hist)}</div>
        </div>
        <div class="row"><span>Ta position</span><b>${hold.amt>0?hold.amt.toFixed(6)+" "+cryptoCur:"Aucune"}</b></div>
        ${hold.amt>0?`<div class="row"><span>Valeur actuelle</span><b>${money(holdVal)}</b></div><div class="row"><span>Plus/moins-value</span><b style="color:${pl>=0?'var(--good)':'var(--bad)'}">${pl>=0?'+':''}${money(pl)} (${hold.cost>0?((pl/hold.cost*100).toFixed(1)):0}%)</b></div>`:""}
        <div class="cx-buyrow">
          <span>€</span><input type="number" id="cpxAmt" value="${buyAmt}" min="1" step="1">
        </div>
        <div class="chips" style="margin:6px 0 10px;">
          <button type="button" class="chip" data-pct="25">25%</button>
          <button type="button" class="chip" data-pct="50">50%</button>
          <button type="button" class="chip" data-pct="100">Tout</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button type="button" class="cbtn p" id="cpxBuy" style="flex:1;">Acheter</button>
          <button type="button" class="cbtn d" id="cpxSell" style="flex:1;" ${hold.amt<=0?'disabled':''}>Vendre tout</button>
        </div>
      `;
      appBody.querySelectorAll('[data-coin]').forEach(b=>b.addEventListener('click',()=>{ cryptoCur=b.dataset.coin; draw(); }));
      appBody.querySelector('#cpxAmt').addEventListener('input',(e)=>{ buyAmt=Math.max(1,parseFloat(e.target.value)||0); });
      appBody.querySelectorAll('[data-pct]').forEach(b=>b.addEventListener('click',()=>{
        buyAmt=Math.max(1,Math.floor(S.money*(parseInt(b.dataset.pct)/100))); appBody.querySelector('#cpxAmt').value=buyAmt;
      }));
      appBody.querySelector('#cpxBuy').addEventListener('click',()=>{
        if(S.money<buyAmt || buyAmt<=0){ log("Pas assez d'argent pour investir.","bad"); return; }
        S.money-=buyAmt; hold.amt+=buyAmt/price; hold.cost+=buyAmt;
        log(`Achat de ${cryptoCur} pour ${money(buyAmt)}.`,"good"); save(); draw();
      });
      appBody.querySelector('#cpxSell').addEventListener('click',()=>{
        const val=hold.amt*price;
        S.money+=val; log(`Vente de ta position ${cryptoCur} : +${money(val)}.`, val>=hold.cost?"good":"bad");
        hold.amt=0; hold.cost=0; save(); draw();
      });
    };
    draw();
    const t=setInterval(()=>{
      CRYPTOS.forEach(c=>{
        let step=(Math.random()-0.5)*c.vol*0.4;
        if(rnd(1,1000)===1) step += (Math.random()<0.5?1:-1)*rnd(30,90)/100;
        const v=Math.max(c.base*0.005, S.crypto.prices[c.k]*(1+step));
        S.crypto.prices[c.k]=v;
        const h=S.crypto.history[c.k]; h.push(v); if(h.length>60) h.shift();
      });
      draw();
    }, 900);
    cleanupFn=()=>clearInterval(t);
  }

    const symbols=["★","♥","♦","♣","☀","☾","✦","⬟"];
    let deck=[...symbols,...symbols].sort(()=>Math.random()-0.5).map((s,i)=>({id:i,s,open:false,matched:false}));
    let first=null, moves=0, lock=false;
    const draw=()=>{
      const won=deck.every(c=>c.matched);
      appBody.innerHTML = `
        <div class="row"><span>Coups</span><b>${moves}</b></div>
        <div class="row"><span>Meilleur score</span><b>${S.miniGameScores.memoryBest!=null?S.miniGameScores.memoryBest+" coups":"—"}</b></div>

        if(lock) return;
        const c=deck.find(x=>x.id==el.dataset.c);
        if(c.open||c.matched) return;
        c.open=true;
        if(!first){ first=c; draw(); return; }
        moves++;
        if(first.s===c.s){ first.matched=true; c.matched=true; first=null; draw();
          if(deck.every(x=>x.matched)){ if(S.miniGameScores.memoryBest==null||moves<S.miniGameScores.memoryBest){ S.miniGameScores.memoryBest=moves; save(); } }
        } else {
          lock=true; draw();
          setTimeout(()=>{ first.open=false; c.open=false; first=null; lock=false; draw(); },700);
        }
      }));
    };
    draw();
  }

    function rndFood(){ let f; do{ f={x:rnd(0,cols-1),y:rnd(0,rows-1)}; }while(snake.some(s=>s.x===f.x&&s.y===f.y)); return f; }
    function draw(){
      ctx.fillStyle="#0d1020"; ctx.fillRect(0,0,cols*cell,rows*cell);
      ctx.fillStyle="#e0637a"; ctx.fillRect(food.x*cell+2,food.y*cell+2,cell-4,cell-4);

    }
    function step(){
      if(over) return;
      dir=nextDir;
      const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
        over=true; if(score>S.miniGameScores.snake){ S.miniGameScores.snake=score; save(); }
        draw(); return;
      }
      snake.unshift(head);
      if(head.x===food.x && head.y===food.y){ score++; appBody.querySelector('#snakeScore').textContent=score; food=rndFood(); }
      else snake.pop();
      draw();
    }
    draw();
    const t=setInterval(step,140);

    function setDir(nx,ny){ if(dir.x===-nx&&dir.y===-ny) return; nextDir={x:nx,y:ny}; }

  function renderFlappyApp(){
    appTitle.textContent="Flappy Wing";
    const W=240,H=320;
    appBody.innerHTML = `
      <div style="text-align:center;">
        <canvas id="flapC" width="${W}" height="${H}" style="background:linear-gradient(#1a2550,#0d1020);border-radius:10px;max-width:100%;"></canvas>
        <div style="font-size:12px;color:var(--sub);margin:8px 0;">Score : <b id="flapScore" style="color:var(--text)">0</b> · Record : ${S.miniGameScores.flappy}</div>
        <button type="button" class="cbtn p" id="flapBtn" style="width:100%;">Sauter</button>
      </div>`;
    const cv=appBody.querySelector('#flapC'), ctx=cv.getContext('2d');
    let birdY=H/2, vel=0, pipes=[{x:W,gapY:H/2}], score=0, over=false, started=false;
    const gap=100, pipeW=36, speed=2.1;
    function reset(){ birdY=H/2; vel=0; pipes=[{x:W,gapY:rnd(60,H-60)}]; score=0; over=false; started=false; appBody.querySelector('#flapScore').textContent=0; }
    function flap(){ if(over){ reset(); return; } started=true; vel=-5.4; }
    function draw(){
      ctx.fillStyle="#0d1020"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#5fd39a";
      pipes.forEach(p=>{
        ctx.fillRect(p.x,0,pipeW,p.gapY-gap/2);
        ctx.fillRect(p.x,p.gapY+gap/2,pipeW,H-(p.gapY+gap/2));
      });
      ctx.fillStyle="#f4d089"; ctx.beginPath(); ctx.arc(44,birdY,9,0,Math.PI*2); ctx.fill();
      if(over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff"; ctx.font="14px sans-serif"; ctx.textAlign="center"; ctx.fillText("Perdu — touche pour rejouer",W/2,H/2); }
      else if(!started){ ctx.fillStyle="#fff"; ctx.font="13px sans-serif"; ctx.textAlign="center"; ctx.fillText("Touche pour voler",W/2,H/2); }
    }
    function tick(){
      if(started && !over){
        vel+=0.32; birdY+=vel;
        pipes.forEach(p=>p.x-=speed);
        if(pipes[pipes.length-1].x<W-150) pipes.push({x:W,gapY:rnd(60,H-60)});
        if(pipes[0].x<-pipeW){ pipes.shift(); score++; appBody.querySelector('#flapScore').textContent=score; }
        const b={x:44,y:birdY,r:9};
        if(birdY-9<0 || birdY+9>H) over=true;
        pipes.forEach(p=>{
          if(b.x+b.r>p.x && b.x-b.r<p.x+pipeW){
            if(b.y-b.r<p.gapY-gap/2 || b.y+b.r>p.gapY+gap/2) over=true;
          }
        });
        if(over && score>S.miniGameScores.flappy){ S.miniGameScores.flappy=score; save(); }
      }
      draw();
      raf=requestAnimationFrame(tick);
    }
    let raf=requestAnimationFrame(tick);
    cv.addEventListener('click',flap);
    appBody.querySelector('#flapBtn').addEventListener('click',flap);
    cleanupFn=()=>cancelAnimationFrame(raf);
  }

function pickEvent(){
  let pool = RANDOM_EVENTS.filter(e=>S.age>=e.min && S.age<=e.max && !S.recentEvents.includes(e.id) && (!e.cond || e.cond(S)));
  if(pool.length===0) pool = RANDOM_EVENTS.filter(e=>S.age>=e.min && S.age<=e.max && (!e.cond || e.cond(S)));
  if(pool.length===0) return null;
  // pondération contextuelle : stress élevé attire les mauvais événements, bonne réputation les bons
  let weighted = pool.slice();
  if(S.stress>=70) weighted = weighted.concat(pool.filter(e=>e.cls==="bad"), pool.filter(e=>e.cls==="bad"));
  if(S.reputation>=70) weighted = weighted.concat(pool.filter(e=>e.cls==="good"), pool.filter(e=>e.cls==="good"));
  if(S.friends && S.friends.length===0 && S.age>=10 && S.age<=30) weighted = weighted.concat(pool.filter(e=>e.id===21||e.id===31));
  const ev = pick(weighted.length?weighted:pool);
  S.recentEvents.push(ev.id);
  if(S.recentEvents.length>8) S.recentEvents.shift();
  return ev;
}
const NPC_JOBS=["étudiant(e)","vendeur/se","employé(e) de bureau","enseignant(e)","infirmier/ère","développeur/se","artisan","commercial(e)","chauffeur","sans emploi","entrepreneur(e)","fonctionnaire","artiste","cuisinier/ère"];
const WEALTH_ORDER=["précaire","modeste","stable","aisé","riche"];
function npcLife(npc,text){ if(!npc) return; (npc.life=npc.life||[]).push({age:S.age,text}); if(npc.life.length>40) npc.life.shift(); }
function simulateNPC(npc,label,pushY,opts){
  if(!npc || npc.alive===false) return;
  opts=opts||{};
  if(npc.job===undefined) npc.job=pick(NPC_JOBS);
  if(!npc.wealth) npc.wealth="stable";
  if(npc.mood==null) npc.mood=65;
  // humeur dérive doucement
  npc.mood=clamp(npc.mood+rnd(-6,6));
  // emploi
  if(rnd(1,100)<=10){
    if(npc.job==="sans emploi" && rnd(1,100)<=55){ npc.job=pick(NPC_JOBS.filter(j=>j!=="sans emploi")); npcLife(npc,`A retrouvé un emploi : ${npc.job}.`); if(opts.surface) pushY(`${label} ${npc.name} a retrouvé un emploi.`,"good"); }
    else if(npc.job!=="sans emploi" && rnd(1,100)<=15){ npcLife(npc,`A perdu son emploi de ${npc.job}.`); npc.job="sans emploi"; npc.wealth=WEALTH_ORDER[Math.max(0,WEALTH_ORDER.indexOf(npc.wealth)-1)]; if(opts.surface) pushY(`${label} ${npc.name} a perdu son emploi.`,"bad"); }
    else if(npc.job!=="sans emploi"){ npcLife(npc,`A changé de poste : maintenant ${npc.job=pick(NPC_JOBS.filter(j=>j!=="sans emploi"&&j!==npc.job))}.`); }
  }
  // patrimoine
  if(rnd(1,100)<=8){
    const i=WEALTH_ORDER.indexOf(npc.wealth);
    if(npc.job!=="sans emploi" && rnd(1,100)<=55 && i<4){ npc.wealth=WEALTH_ORDER[i+1]; npcLife(npc,`Sa situation financière s'améliore (${npc.wealth}).`); }
    else if(i>0){ npc.wealth=WEALTH_ORDER[i-1]; npcLife(npc,`Traverse une période financière difficile (${npc.wealth}).`); }
  }
  // déménagement
  if(rnd(1,100)<=3){ const city=pick(CITIES); npcLife(npc,`A déménagé à ${city}.`); }
}
function familyLifeGoesOn(pushY){
  simulateNPC(S.father,"Ton père",pushY,{surface:S.age-( S.father.lastSeen||0)>=4});
  simulateNPC(S.mother,"Ta mère",pushY,{surface:S.age-( S.mother.lastSeen||0)>=4});
  if(S.partner) simulateNPC(S.partner,"",pushY,{});
  (S.siblings||[]).forEach(sib=>{
    simulateNPC(sib,"",pushY,{});
    const longTime = (S.age-(sib.lastSeen||0))>=5;
    if(!sib.married && rnd(1,100)<=4){ sib.married=true; npcLife(sib,"S'est marié(e)."); if(longTime) pushY(`Tu apprends que ${sib.name} s'est marié(e).`,"good"); }
    else if(sib.married && (sib.kidsCount||0)<3 && rnd(1,100)<=3){ sib.kidsCount=(sib.kidsCount||0)+1; sib.hasKid=true; npcLife(sib,`A eu un enfant (${sib.kidsCount} au total).`); if(longTime) pushY(`Tu apprends que ${sib.name} a eu un enfant.`,"good"); }
    else if(sib.married && rnd(1,100)<=2){ sib.married=false; npcLife(sib,"A divorcé."); if(longTime) pushY(`Tu apprends que ${sib.name} a divorcé.`,"bad"); }
  });
  if(S.father && S.father.alive && !S.father.retired && S.age>=35 && rnd(1,100)<=3){ S.father.retired=true; pushY(`${S.father.name} a pris sa retraite.`,"good"); }
  if(S.mother && S.mother.alive && !S.mother.retired && S.age>=35 && rnd(1,100)<=3){ S.mother.retired=true; pushY(`${S.mother.name} a pris sa retraite.`,"good"); }
}

function haveAffair(){
  S.affair=true;
  const caught = rnd(1,100) <= 40;
  if(caught){
    S.married=false; S.relationship=null; S.affair=false; S.partner=null;
    S.happiness=clamp(S.happiness-25); S.reputation=clamp(S.reputation-20); S.karma=clamp(S.karma-15);
    log("Ton infidélité a été découverte. Ton couple est brisé et ta réputation en a pris un coup.","bad"); mark("Infidélité découverte : rupture.");
  } else {
    S.happiness=clamp(S.happiness+8); S.karma=clamp(S.karma-8);
    log("Tu as eu une aventure secrète. Pour l'instant, personne ne le sait.","good");
  }
}
function talkBackParents(){
  const parent = Math.random()<0.5 && S.father.alive ? S.father : (S.mother.alive ? S.mother : S.father);
  if(!parent){ log("Tu n'as plus personne à qui répondre à la maison."); return; }
  if(rnd(1,100)<=55){
    remember(parent,"Tu lui as répondu et t'es fait sévèrement gronder.",-rnd(6,14));
    S.stress=clamp(S.stress+rnd(4,10));
    log(`Tu t'es fait sévèrement gronder par ${parent.name} après lui avoir répondu.`,"bad");
  } else {
    S.happiness=clamp(S.happiness+rnd(3,7));
    remember(parent,"Tu lui as tenu tête.",-rnd(1,4));
    log(`Tu as tenu tête à ${parent.name} et ça t'a fait du bien.`,"good");
  }
}
function startFight(){
  const chance = 45 + Math.floor(S.looks/10) - Math.floor(S.health<30?15:0);
  if(rnd(1,100)<=chance){
    S.happiness=clamp(S.happiness+rnd(4,10));
    S.looks=clamp(S.looks+rnd(0,3));
    log("Tu as gagné la bagarre. Ta réputation grimpe.","good");
  } else {
    S.health=clamp(S.health-rnd(8,20));
    S.happiness=clamp(S.happiness-rnd(5,12));
    log("Tu t'es fait frapper et sérieusement amoché(e).","bad");
  }
}
const SERIOUS_ILLNESS=[
  {n:"Cancer", trig:s=>s.age>=35, base:s=>Math.floor(s.age/32)+(s.conditions.length?1:0)},
  {n:"Crise cardiaque", trig:s=>s.age>=45, base:s=>Math.floor(s.age/38)+(s.stress>=80?1:0)},
  {n:"AVC", trig:s=>s.age>=55, base:s=>Math.floor(s.age/45)},
];
function seriousIllnessCheck(pushY){
  SERIOUS_ILLNESS.forEach(ill=>{
    if(!ill.trig(S)) return;
    if(rnd(1,1000)<=ill.base(S)){
      const fatalChance = clamp(16 - Math.floor(S.health/6) - (S.healthInsurance?8:0) + (S.age>80?10:0));
      const cost=rnd(3000,20000); const paid=S.healthInsurance?Math.floor(cost*0.2):cost;
      S.money-=paid; addFin(`Traitement : ${ill.n}`,-paid);
      if(rnd(1,100)<=fatalChance){
        S.deathCause=ill.n; S.health=0;
        pushY(`Diagnostic grave : ${ill.n}. Malgré les soins, la maladie a eu raison de toi.`,"bad");
      } else {
        S.health=clamp(S.health-rnd(15,30)); S.stress=clamp(S.stress+15);
        pushY(`Diagnostic grave : ${ill.n}. Après un traitement difficile (${money(paid)}), tu t'en sors.`,"bad");
        mark(`A survécu à : ${ill.n}.`);
      }
    }
  });
}
function pickDeathCause(){
  const pool=[];
  if(S.age>=85) pool.push({w:20,txt:"Vieillesse"});
  else if(S.age>=70) pool.push({w:10,txt:"Vieillesse"});
  else if(S.age>=55) pool.push({w:3,txt:"Vieillesse précoce"});
  (S.conditions||[]).forEach(c=>pool.push({w:2,txt:`Complications liées à : ${c.n}`}));
  if((S.vehicles||[]).length) pool.push({w:1,txt:"Accident de la route"});
  pool.push({w:1,txt:"Renversé(e) par un véhicule"});
  if(S.job && /pompier|policier|militaire|maçon|mécanicien/i.test(S.jobTitle||"")) pool.push({w:1,txt:"Accident du travail"});
  pool.push({w:1,txt:"Crise cardiaque soudaine"});
  pool.push({w:1,txt:"Cause naturelle"});
  const total=pool.reduce((a,p)=>a+p.w,0); let r=rnd(1,total);
  for(const p of pool){ r-=p.w; if(r<=0) return p.txt; }
  return pool[0].txt;
}
function checkDeathMidYear(){
  if(S.health<=0 && S.alive){ S.alive=false; log(`${S.name} s'est éteint(e) à l'âge de ${S.age} ans.`,"bad"); }
}

function addFin(label,amt){ if(!window.__fin) window.__fin=[]; if(amt) window.__fin.push({label,amt}); }
function ageUp(){
  try{
    if(!S || !S.alive) return;
    const before = {health:S.health, happiness:S.happiness, money:S.money, smarts:S.smarts, looks:S.looks};
    const yearEntries = [];
    window.__fin=[];
    const pushY=(text,cls)=>{ log(text,cls); yearEntries.push({text,cls}); };
    S.age++;
    if(S.jailYears>0){
      S.jailYears--; S.happiness=clamp(S.happiness-4); S.stress=clamp(S.stress+3);
      if(rnd(1,100)<=(S.prisonGang?10:25)){ S.health=clamp(S.health-rnd(6,16)); pushY("Une bagarre éclate en détention : tu es blessé(e).","bad"); }
      if(S.behavior>=4 && S.jailYears>0 && rnd(1,100)<=25){ S.jailYears--; pushY("Bonne conduite : ta peine est réduite d'un an.","good"); }
      if(S.jailYears<=0){ S.jailYears=0; S.cleanYears=0; S.behavior=0; S.prisonGang=false; pushY("Tu es libéré(e) de prison.","good"); }
      else pushY(`Une année de plus derrière les barreaux (${S.jailYears} an(s) restant(s)).`,"bad");
      checkDeathMidYear(); save(); render(); showYearModal(S.age, yearEntries, before); return;
    }
    if(S.fugitive){
      S.happiness=clamp(S.happiness-3); S.stress=clamp(S.stress+5);
      if(rnd(1,100)<=35){ S.fugitive=false; S.jailYears=(S.escapedRemaining||1)+3; pushY(`Tu es rattrapé(e) par la police : retour en prison pour ${S.jailYears} an(s).`,"bad"); save(); render(); showYearModal(S.age, yearEntries, before); return; }
      pushY("Une année de plus en cavale, toujours sur le qui-vive.","bad");
    } else if(S.criminalRecord){ S.cleanYears=(S.cleanYears||0)+1; }
    if(S.coldCase && rnd(1,100)<=4){ S.coldCase=false; pushY("L'enquête sur ton passé est relancée par la police.","bad"); arrest("Meurtre (affaire relancée)",rnd(15,28)); }
    if(S.gang){
      if(S.gang.rank>=1){ const cut=S.gang.rank*3500; S.money+=cut; addFin("Part de l'organisation",cut); }
      if(rnd(1,100)<=6){ pushY(`Descente de police contre « ${S.gang.name} ».`,"bad"); arrest("Association de malfaiteurs",rnd(2,7)); }
      else if(rnd(1,100)<=5){ S.health=clamp(S.health-rnd(8,16)); pushY("Un gang rival t'attaque : tu es blessé(e).","bad"); }
    }
    if(S.pregnant){
      S.pregnant=false;
      const kidSex = Math.random()<0.5?"M":"F";
      const kid={name: randomPerson(kidSex), age:0, sex:kidSex};
      S.kids.push(kid); S.happiness=clamp(S.happiness+15);
      pushY(`${kid.name} est né(e) ! Ta famille s'agrandit.`,"good"); mark(`Naissance de ${kid.name}.`);
    }
    S.kids.forEach(k=>k.age++);
    if(S.kids.length){
      let kidCost=0;
      S.kids.forEach(k=>{ kidCost += k.age<3?3200 : k.age<6?4200 : k.age<11?5000 : k.age<15?6200 : k.age<18?7500 : 0; });
      if(kidCost>0){ S.money-=kidCost; addFin(`Frais des enfants (nourriture, école, activités)`,-kidCost); S.happiness=clamp(S.happiness+Math.min(6,S.kids.length*2)); }
    }
    if(S.father && S.father.alive && rnd(1,100)<=Math.max(1,S.age>60?6:1)){ S.father.alive=false; pushY(`Ton père, ${S.father.name}, est décédé.`,"bad"); mark(`Décès de ton père, ${S.father.name}.`); S.happiness=clamp(S.happiness-15); }
    if(S.mother && S.mother.alive && rnd(1,100)<=Math.max(1,S.age>60?6:1)){ S.mother.alive=false; pushY(`Ta mère, ${S.mother.name}, est décédée.`,"bad"); mark(`Décès de ta mère, ${S.mother.name}.`); S.happiness=clamp(S.happiness-15); }

    processStudies(pushY);
    if(S.job){
      const gross=S.salary, tax=Math.floor(gross*0.18), net=gross-tax; S.money += net; S.expYears++;
      addFin("Salaire brut",gross); addFin("Impôts & cotisations",-tax);
      pushY(`Salaire annuel : ${money(net)} nets (${money(gross)} bruts).`,"good");
      if(S.telework){ S.stress=clamp(S.stress-8); S.happiness=clamp(S.happiness+2); }
      if(rnd(1,100)<=20){ const bonus=Math.floor(S.salary*rnd(4,10)/100); S.money+=bonus; addFin("Prime",bonus); pushY(`Prime de performance : +${money(bonus)}.`,"good"); }
      if(S.stress>=90){
        S.repPro=clamp(S.repPro-6); pushY(`Burn-out : tu dois arrêter ton poste de ${S.jobTitle}.`,"bad");
        endJob(); S.health=clamp(S.health-15); S.happiness=clamp(S.happiness-15); S.stress=50;
      } else if(rnd(1,100) <= 3 + (S.reputation<30?6:0) + (S.stress>75?4:0) + (S.criminalRecord?3:0)){
        S.repPro=clamp(S.repPro-10); pushY(`Licenciement : tu perds ton poste de ${S.jobTitle}.`,"bad");
        endJob(); S.happiness=clamp(S.happiness-12); S.reputation=clamp(S.reputation-5);
      } else if(rnd(1,100)<=8){
        const inc=Math.floor(S.salary*rnd(3,8)/100); S.salary+=inc; pushY(`Augmentation annuelle : +${money(inc)}/an.`,"good");
      }
    }
    if(S.pension>0){ S.money+=S.pension; addFin("Pension de retraite",S.pension); pushY(`Pension de retraite : +${money(S.pension)}.`,"good"); }
    if(S.company){
      const c=S.company;
      const profit=Math.floor(c.revenue*rnd(75,125)/100 - c.expenses);
      if(profit>=0){ S.money+=Math.floor(profit*0.6); addFin("Bénéfices de l'entreprise",Math.floor(profit*0.6)); c.value=Math.floor(c.value*1.08+profit*0.3); c.debt=Math.max(0,(c.debt||0)-profit*0.4); pushY(`${c.name} : bénéfice de ${money(profit)}.`,"good"); }
      else { c.debt=(c.debt||0)-profit; c.value=Math.floor(c.value*0.92); pushY(`${c.name} : perte de ${money(-profit)}.`,"bad"); S.stress=clamp(S.stress+8); }
      if(c.debt>c.value*1.2){
        const loss=Math.min(S.money,Math.floor(c.debt/2));
        S.money-=loss; S.reputation=clamp(S.reputation-15); S.happiness=clamp(S.happiness-20);
        pushY(`Faillite de ${c.name} : tu perds ${money(loss)}.`,"bad"); S.company=null;
      }
    }

    if(S.savings>0){ const interest=Math.floor(S.savings*0.025); S.savings+=interest; if(interest>0) pushY(`Intérêts sur ton épargne : +${money(interest)}.`,"good"); }

    if(S.housing){
      S.housing.value=Math.floor(S.housing.value*1.02);
      if(S.housing.rented){ S.money-=S.housing.rentYear; addFin("Loyer",-S.housing.rentYear); }
      const living=6000; S.money-=living; addFin("Vie courante (nourriture, énergie, assurances)",-living);
    } else if(S.age>=25){ S.happiness=clamp(S.happiness-2); }
    if(S.loans.length){
      S.loans.forEach(l=>{
        const interest=Math.floor(l.balance*l.rate);
        const payment=Math.min(l.balance+interest, l.yearlyPayment);
        S.money-=payment; l.balance=Math.max(0,l.balance+interest-payment); addFin("Remboursement : "+l.kind,-payment);
      });
      const nb=S.loans.length;
      S.loans = S.loans.filter(l=>l.balance>0);
      if(S.loans.length<nb){ S.repFinance=clamp(S.repFinance+6); pushY("Un de tes emprunts est totalement remboursé !","good"); }
    }
    updateFuelPrice();
    if(S.vehicles.length){
      let vc=0, fuel=0;
      S.vehicles.forEach(v=>{
        vc+=vehCost(v); v.value=Math.max(200,Math.floor(v.value*0.9));
        const spec=VEH_SPEC[v.type]||{conso:0,km:8000,ctrl:0};
        v.km=(v.km||0)+spec.km;
        if(spec.conso>0){ const fc=fuelCostOf(v); fuel+=fc; }
      });
      S.money-=vc; addFin("Entretien & assurance véhicules",-vc);
      if(fuel>0){ S.money-=fuel; addFin(`Carburant (${fuelPriceLabel()})`,-fuel); }
      S.vehicles.forEach(v=>{
        const spec=VEH_SPEC[v.type]||{ctrl:0};
        const due=(S.age-(v.lastControl||S.age))>=2;
        if(spec.ctrl>0 && due){
          v.lastControl=S.age;
          if(rnd(1,100)<=25){
            const repair=rnd(300,1200); S.money-=repair; addFin(`Réparations (contrôle technique) — ${v.name}`,-repair);
            pushY(`${v.name} a échoué au contrôle technique : réparations obligatoires (${money(repair)}).`,"bad");
          } else { S.money-=spec.ctrl; addFin(`Contrôle technique — ${v.name}`,-spec.ctrl); }
        }
        if(spec.conso>0 && rnd(1,100)<=Math.min(30,6+Math.floor(v.km/15000))){
          const roll=rnd(1,100);
          if(roll<=8){
            S.vehicles=S.vehicles.filter(x=>x.id!==v.id);
            pushY(`${v.name} est totalement hors d'usage. Il faut le remplacer.`,"bad");
          } else if(roll<=30){
            const injChance=15+Math.floor((100-S.luck)/10);
            if(rnd(1,100)<=injChance){
              const hurt=rnd(10,25); S.health=clamp(S.health-hurt); const cost=rnd(500,3000); S.money-=cost;
              addFin(`Accident — ${v.name}`,-cost);
              pushY(`Accident avec ${v.name} : tu es blessé(e) et dois payer ${money(cost)} de réparations.`,"bad");
            } else {
              const cost=rnd(200,900); S.money-=cost; addFin(`Panne — ${v.name}`,-cost);
              pushY(`${v.name} est tombée en panne : ${money(cost)} de réparations.`,"bad");
            }
          }
        }
      });
    }
    if(S.luxury.length){ S.luxury.forEach(l=>{ l.value=Math.max(100,Math.floor(l.value*(1+luxValueGrow(l.name)))); }); }
    if(S.pets.length){
      let pc=0;
      S.pets.forEach(p=>{ p.age++; const cat=PET_CATALOG.find(x=>x.type===p.type); pc+=Math.floor((cat?cat.vet:100)*0.6)+((cat?cat.upkeep:150)||150); });
      S.money-=pc; addFin("Frais animaux",-pc);
      S.pets = S.pets.filter(p=>{
        const cat=PET_CATALOG.find(x=>x.type===p.type); const lim=(cat&&cat.life)||12;
        if(p.age>=lim && rnd(1,100)<=35){ pushY(`Ton animal ${p.name} est mort de vieillesse.`,"bad"); S.happiness=clamp(S.happiness-10); return false; }
        return true;
      });
      S.happiness=clamp(S.happiness+S.pets.length*2);
    }
    if(S.money<0){
      const oi=Math.floor(-S.money*0.08); S.money-=oi; addFin("Intérêts de découvert",-oi);
      S.reputation=clamp(S.reputation-3); S.happiness=clamp(S.happiness-4); S.stress=clamp(S.stress+5);
      S.repFinance=clamp(S.repFinance-4); pushY("Tu es à découvert : la banque te facture des intérêts.","bad");
    }

    S.happiness=clamp(S.happiness+rnd(-4,3));
    S.health=clamp(S.health - (S.age>55? rnd(1,5) : rnd(-1,2)) - (S.age>75?rnd(1,4):0));

    familyLifeGoesOn(pushY);
    maybeGetSick(pushY);
    accidentAndHospital(pushY);
    seriousIllnessCheck(pushY);
    worldEvolves(pushY);
    yearlyCryptoDrift(pushY);
    socialMediaYearly(pushY);

    if(rnd(1,100)<=68){ const ev=pickEvent(); if(ev){ ev.fn(S); pushY(ev.txt, ev.cls); } }
    else { pushY("Une année plutôt tranquille passe."); }

    const mTxt = checkMilestone();
    if(mTxt){ pushY(mTxt, "good"); }

    S.maxMoney=Math.max(S.maxMoney||0, S.money+S.savings);
    checkObjectives(pushY);
    checkAchievements(pushY);
    relationshipDrift(pushY);

    let deathChance = 0.08;
    if(S.age>=40) deathChance=0.6;
    if(S.age>=60) deathChance=2.5;
    if(S.age>=75) deathChance=7;
    if(S.age>=85) deathChance=18;
    if(S.age>=95) deathChance=38;
    if(S.diff==="difficile") deathChance*=1.4;
    if(S.diff==="facile") deathChance*=0.6;
    if(S.health<=0) deathChance=100;
    if(S.health<20) deathChance+=15;

    let died=false;
    if(Math.random()*100 < deathChance || S.age>110){
      S.alive=false; died=true;
      if(!S.deathCause) S.deathCause = S.age>110?"Vieillesse extrême":pickDeathCause();
      pushY(`${S.name} s'est éteint(e) à l'âge de ${S.age} ans — ${S.deathCause}.`,"bad");
    }
    save();
    render();
    if(!died) showYearModal(S.age, yearEntries, before);
  }catch(err){
    try{ save(); }catch(e2){}
    render();
  }
}

function statDeltaLine(label, before, after, suffix){
  const d = Math.round(after-before);
  const sign = d>0?"+"+d:(d<0?d:"±0");
  const cls = d>0?"good":(d<0?"bad":"");
  return `<div class="row"><span>${label}</span><b class="${cls}" style="color:${d>0?'var(--good)':d<0?'var(--bad)':'var(--sub)'}">${sign}${suffix||""}</b></div>`;
}

function finBlock(){
  const f=window.__fin||[]; if(!f.length) return "";
  const rows=f.map(x=>`<div class="finrow"><span>${x.label}</span><b style="color:${x.amt>0?'var(--good)':'var(--bad)'}">${x.amt>0?'+':'−'}${money(Math.abs(x.amt))}</b></div>`).join("");
  const tot=f.reduce((s,x)=>s+x.amt,0);
  return `<p class="sub" style="margin:4px 0 6px;">Bilan financier</p>${rows}<div class="finrow tot"><span>Solde de l'année</span><b style="color:${tot>=0?'var(--good)':'var(--bad)'}">${tot>=0?'+':'−'}${money(Math.abs(tot))}</b></div><div style="height:12px"></div>`;
}
function showYearModal(age, entries, before){

  bg.innerHTML=`<div class="modal">
    <button class="close-x" id="closeYearM" type="button">${icon('x',22)}</button>
    <h3>${age} ans</h3>
    <p class="sub">Voici ce qui s'est passé cette année</p>
    <div style="margin-bottom:14px;">${list}</div>
    ${finBlock()}
    ${statDeltaLine("Santé", before.health, S.health)}
    ${statDeltaLine("Bonheur", before.happiness, S.happiness)}
    ${statDeltaLine("Intelligence", before.smarts, S.smarts)}
    ${statDeltaLine("Apparence", before.looks, S.looks)}
    ${statDeltaLine("Argent", before.money, S.money, " €")}
    <button class="bigbtn" id="continueYearBtn" type="button" style="margin-top:16px;">Continuer</button>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',(e)=>{ if(e.target===bg) close(); });
  $('#closeYearM').addEventListener('click',close);
  $('#continueYearBtn').addEventListener('click',close);
}

function renderDeath(){
  const adultKids = S.kids.filter(k=>k.age>=16);
  const kidsBtns = adultKids.map((k,i)=>`<button class="bigbtn secondary" data-kid="${i}" type="button" style="margin-bottom:10px;">Continuer en tant que ${k.name} (${k.age} ans)</button>`).join("");
  const prisonYears=(S.record||[]).reduce((a,r)=>a+r.years,0);
  const objDone=(S.objectives||[]).filter(o=>o.done).length;
  const cause = S.deathCause || "Cause naturelle";
  const bilanCards=[
    ["coins","Fortune maximale",money(S.maxMoney||S.money),180],
    ["gem","Fortune finale",money(S.money+S.savings),45],
    ["briefcase","Métiers occupés",S.jobHistory.length,30],
    ["cap","Diplômes obtenus",S.degrees.length,210],
    ["building","Entreprise",S.company?S.company.name:"Aucune",20],
    ["ring","Mariages",S.married?"1 ou plus":"0",330],
    ["users","Enfants",S.kids.length,150],
    ["users","Amis rencontrés",S.friends.length,200],
    ["gavel","Condamnations",(S.record||[]).length,0],
    ["lock","Années en prison",prisonYears,0],
    ["star","Objectifs accomplis",objDone+"/"+(S.objectives||[]).length,45],
    ["trophy","Succès débloqués",(S.achievements||[]).length+"/"+ACHIEVEMENTS.length,45],
    ["globe","Pays visités",(S.travel&&S.travel.visited||[]).length,195],
    ["car","Véhicules possédés",S.vehicles.length,210],
  ].map(([ic,l,v,h])=>`<div class="card2" style="--h:${h}"><div class="ct"><span class="ic">${icon(ic,20)}</span></div><div class="cn">${v}</div><div class="cm">${l}</div></div>`).join("");
  const tl=(S.timeline||[]).map(t=>`<div class="entry" style="margin-bottom:8px;"><span class="yr">${t.age} ans</span>${t.text}</div>`).join("")||`<div class="entry">Aucun événement majeur enregistré.</div>`;
  $('#main').innerHTML = `
  <div class="deathscreen" style="padding-bottom:6px;">
    <div class="hic big">${icon('moon',44)}</div><h1>Fin de vie</h1>
    <p>${S.name} s'est éteint(e) à ${S.age} ans à ${S.city}.</p>
    <div class="causepill">${icon('heart',15)}<span>Cause du décès : <b>${cause}</b></span></div>
  </div>
  <div class="section-title">Bilan de vie</div>
  <div class="cgrid">${bilanCards}</div>
  <div class="section-title">Chronologie</div>
  <div class="feed">${tl}</div>
  <div style="height:6px"></div>
  ${adultKids.length? `<p class="sub" style="margin:14px 2px 10px;">Ta lignée continue. Tu peux incarner l'un de tes enfants.</p>${kidsBtns}`:""}
  <button class="bigbtn" id="restart" type="button" style="margin-top:6px;">Commencer une nouvelle vie</button>
  `;
  $('#restart').addEventListener('click',()=>{ S=null; clearSave(); render(); });
  document.querySelectorAll('[data-kid]').forEach(b=>{
    b.addEventListener('click',()=>{ playAsDescendant(adultKids[parseInt(b.dataset.kid)]); });
  });
}

function playAsDescendant(kid){
  const otherKids = S.kids.filter(k=>k!==kid);
  const share = S.kids.length? Math.floor(S.money/S.kids.length) : 0;
  const lineage = {
    surname: S.surname,
    inheritance: share,
    father: S.sex==="M" ? {name:S.name, alive:false, closeness:70, memory:[]} : {name:"Parent inconnu", alive:false, closeness:50, memory:[]},
    mother: S.sex==="F" ? {name:S.name, alive:false, closeness:70, memory:[]} : {name:"Parent inconnu", alive:false, closeness:50, memory:[]},
    siblings: otherKids.map(k=>({name:k.name, closeness:rnd(50,80), memory:[]})),
    grandparents: [S.father, S.mother].filter(p=>p),
    auntsUncles: S.siblings.map(s=>({name:s.name, closeness:rnd(20,50)}))
  };
  const newName = kid.name.split(' ')[0];
  S = newLife(newName, kid.sex, S.diff, (S.generation||1)+1, lineage);
  S.age = kid.age;
  log(`Tu incarnes maintenant ${S.name}, ${S.age} ans, héritier(e) de la famille ${S.surname}.`,"good");
  save();
  render();
}

function clearSave(){
  try{ localStorage.removeItem('onelife_save'); localStorage.removeItem('lifesim_save'); }catch(e){}
}

S = load();
render();
</script>
